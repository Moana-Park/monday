<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>솜즈:라이프 Somzz:Life 프로토타입 v5.2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --page:#E7EAF2; --page-ink:#1A2340; --page-muted:#566080;
  --panel:#FFFFFF; --panel-line:#D9DEEA; --panel-soft:#F3F5FA; --code:#2F3A66;
  --night:#172036; --night2:#1F2946; --night3:#2A3660; --line:#34416F;
  --mist:#E6E9F4; --haze:#A3ABCB; --moon:#F0C36A; --moon-ink:#1A2036;
  --work:#8B91E0; --wind:#56649F; --nap:#D99B6C; --ok:#8FD1B0; --warn:#F0A38A;
  --text2:#C9CEE3; --hair:rgba(255,255,255,.06); --dim:#7580A8; --sel:#262F50; --moon-text:#F0C36A; --moon-soft:rgba(240,195,106,.16); --warn-text:#F0A38A; --ok-text:#8FD1B0; --tab:#7F88AD; --legal:#8089AD; --scheme:dark;
  --cD:#F0C36A; --cE:#9FD6C0; --cN:#A9AEF0; --cO:#7F88AD; --cC:#E6A7C9; --cX:#5B648C;
  --display:"Gowun Batang","AppleMyungjo","Batang",serif;
  --sans:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--page:#111729;--page-ink:#E6E9F4;--page-muted:#A3ABCB;--panel:#1A2139;--panel-line:#2E3860;--panel-soft:#222B48;--code:#C9CFF0;}
}
:root[data-theme="dark"]{--page:#111729;--page-ink:#E6E9F4;--page-muted:#A3ABCB;--panel:#1A2139;--panel-line:#2E3860;--panel-soft:#222B48;--code:#C9CFF0;}

.screen{transition:background-color .5s ease,color .5s ease}
.screen[data-mode="day"]{--night:#EEF2F8;--night2:#FFFFFF;--night3:#E1E8F4;--line:#C6D0E2;--mist:#1B2340;--haze:#56607F;--moon:#F0B54A;--moon-ink:#1B2340;--moon-text:#8A5A0B;--moon-soft:#FCEFD3;--text2:#3A4466;--hair:rgba(20,30,60,.09);--dim:#8E97B3;--sel:#FFF4DC;--tab:#7A84A3;--legal:#6B7494;--scheme:light;--work:#6E76D8;--wind:#9AA6D6;--nap:#B8652E;--warn-text:#B4492C;--ok-text:#23845F;--cD:#A86A10;--cE:#23845F;--cN:#4E55C2;--cO:#6F7690;--cC:#A5487C;--cX:#A3ABC2}
.screen[data-mode="night"]{--night:#0B0F1D;--night2:#131A2E;--night3:#1C243E;--line:#283152;--mist:#C4C8D8;--haze:#868DA8;--moon:#C98F45;--moon-ink:#0B0F1D;--moon-text:#D59D55;--moon-soft:rgba(201,143,69,.15);--text2:#AEB3C7;--sel:#1D2540;--dim:#566080;--tab:#626A88;--legal:#6C7391;--wind:#3F4A7A;--work:#6E74B8}
.screen[data-mode="rest"]{--night:#F3F1F8;--night2:#FFFFFF;--night3:#E8E4F3;--line:#D2CCE5;--mist:#26213D;--haze:#625C7E;--moon:#6B5FC0;--moon-ink:#FFFFFF;--moon-text:#5548AE;--moon-soft:#ECE8FA;--text2:#433D5E;--hair:rgba(40,30,80,.08);--dim:#A09AB8;--sel:#EFEBFC;--tab:#8A84A6;--legal:#716B8E;--scheme:light;--work:#7C84D8;--wind:#B3ABDB;--nap:#B8652E;--warn-text:#B4492C;--ok-text:#23845F;--cD:#A86A10;--cE:#23845F;--cN:#4E55C2;--cO:#6F7690;--cC:#A5487C;--cX:#A3ABC2}
.modechip{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--haze);margin-top:6px}
.modechip i{width:8px;height:8px;border-radius:50%;background:var(--moon)}
.blk{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--hair);font-size:14px}
.blk:last-child{border-bottom:0}
.adj{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;margin-top:8px}
.adj b{text-align:center;font-family:var(--display);font-size:20px}
.sup{opacity:.62}
.sup small{color:var(--warn-text)!important}
.checkrow{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:var(--night);border:0;border-radius:12px;padding:10px 12px;margin-top:8px;min-height:44px}
.checkrow .bx{flex:0 0 20px;height:20px;border-radius:6px;border:1.5px solid var(--haze);display:grid;place-items:center}
.checkrow[aria-pressed="true"] .bx{background:var(--moon);border-color:var(--moon)}
.checkrow[aria-pressed="true"] .bx::after{content:"";width:8px;height:8px;border-radius:2px;background:var(--moon-ink)}
.inv{width:100%;border-collapse:collapse;font-size:12.5px}
.inv th,.inv td{padding:7px 4px;border-bottom:1px solid var(--hair);text-align:center;vertical-align:top}
.inv th:first-child,.inv td:first-child{text-align:left}
.inv td.note{text-align:left;color:var(--haze);font-size:11.5px}
.persona{background:var(--panel-soft);border-radius:12px;padding:12px 14px;margin-top:10px;font-size:13.5px}
.persona b{font-size:15px}
.persona ul{margin:6px 0 0;padding-left:18px}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0}
body{background:var(--page);color:var(--page-ink);font-family:var(--sans);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
button[disabled]{cursor:not-allowed}
:focus-visible{outline:2px solid var(--moon);outline-offset:2px}

.stage{display:flex;gap:40px;justify-content:center;align-items:flex-start;padding:32px 24px 48px;max-width:1300px;margin:0 auto}
.device{flex:0 0 auto;width:410px;height:864px;border-radius:52px;background:#0E1324;padding:10px;box-shadow:0 30px 60px -30px rgba(10,15,35,.55)}
.screen{position:relative;width:100%;height:100%;border-radius:42px;overflow:hidden;background:var(--night);color:var(--mist)}
.panel{flex:1 1 440px;max-width:580px;background:var(--panel);border:1px solid var(--panel-line);border-radius:18px;padding:24px 26px;position:sticky;top:24px;max-height:calc(100dvh - 48px);overflow-y:auto}
@media (max-width:960px){
  .stage{flex-direction:column;align-items:center;padding:0 0 32px;gap:24px}
  .device{width:100%;max-width:480px;height:100dvh;border-radius:0;padding:0;box-shadow:none}
  .screen{border-radius:0}
  .panel{position:static;max-height:none;width:calc(100% - 32px);max-width:580px}
}

/* logo (교체 지점과 연동) */
.logo{display:inline-flex;align-items:center;gap:8px;color:var(--mist)}
.logo .wm{font-family:var(--display);font-weight:700;letter-spacing:-.3px}
.logo-lg .wm{font-size:40px}
.logo-sm .wm{font-size:17px}

.scr{display:flex;flex-direction:column;height:100%}
.scr-top{padding:22px 22px 6px;flex:0 0 auto}
.scr-body{flex:1 1 auto;overflow-y:auto;padding:8px 22px 24px;scrollbar-width:thin}
.scr-foot{flex:0 0 auto;padding:12px 22px 24px;background:var(--night);border-top:1px solid rgba(255,255,255,.04)}
.progress{height:4px;background:var(--night3);border-radius:4px;overflow:hidden;margin-top:14px}
.progress>i{display:block;height:100%;background:var(--moon);border-radius:4px;transition:width .3s}
.back{background:none;border:0;padding:6px 0;color:var(--haze);font-size:14px;display:inline-flex;align-items:center;gap:4px;min-height:36px}
h1.t{font-family:var(--display);font-weight:700;font-size:24px;line-height:1.38;margin:18px 0 6px;letter-spacing:-.3px}
p.sub{color:var(--haze);margin:0 0 18px;font-size:14px}
.lbl{display:block;font-size:13px;color:var(--haze);margin:18px 0 8px}

.btn{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;min-height:52px;border-radius:14px;border:0;background:var(--moon);color:var(--moon-ink);font-weight:600;font-size:16px;padding:0 14px}
.btn[disabled]{background:var(--night3);color:var(--dim)}
.btn.ghost{background:transparent;color:var(--mist);border:1px solid var(--line)}
.btn.sm{min-height:40px;font-size:14px;border-radius:10px;width:auto;padding:0 14px}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.link{background:none;border:0;color:var(--moon-text);font-size:14px;padding:6px 0;min-height:36px;text-decoration:underline;text-underline-offset:3px}

.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:var(--night2);border:1.5px solid transparent;border-radius:14px;padding:14px 16px;margin-bottom:10px;min-height:52px}
.opt[aria-pressed="true"]{border-color:var(--moon);background:var(--sel)}
.opt .mk{flex:0 0 20px;height:20px;border-radius:50%;border:1.5px solid var(--haze);margin-top:2px;display:grid;place-items:center}
.opt.multi .mk{border-radius:6px}
.opt[aria-pressed="true"] .mk{background:var(--moon);border-color:var(--moon)}
.opt[aria-pressed="true"] .mk::after{content:"";width:8px;height:8px;border-radius:2px;background:var(--moon-ink)}
.opt b{display:block;font-weight:600;font-size:15px}
.opt small{display:block;color:var(--haze);font-size:13px;margin-top:2px}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:transparent;border-radius:999px;padding:7px 13px;font-size:14px;min-height:40px}
.chip[aria-pressed="true"]{background:var(--moon);border-color:var(--moon);color:var(--moon-ink);font-weight:600}
.field{display:flex;gap:10px}
.field>label{flex:1;min-width:0}
.inp{width:100%;background:var(--night2);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;min-height:48px;color-scheme:var(--scheme)}
.inp:focus{border-color:var(--moon);outline:none}
.hint{font-size:13px;color:var(--haze);margin-top:8px}
.err{font-size:13px;color:var(--warn-text);margin-top:8px}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px;margin:10px 0;cursor:pointer}
.check input{width:20px;height:20px;accent-color:var(--moon);margin-top:2px;flex:0 0 auto}
.srcbox{background:var(--night2);border-radius:14px;padding:12px 16px;margin-bottom:10px}
.srcbox b{display:block;font-weight:600}
.srcbox small{display:block;color:var(--haze);font-size:13px}

.card{background:var(--night2);border-radius:18px;padding:18px;margin-bottom:14px}
.card.hi{background:var(--night3)}
.card h3{font-size:15px;font-weight:600;margin:0 0 8px}
.card p{margin:0;color:var(--text2);font-size:14px}
.muted{color:var(--haze)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:3px 9px;border-radius:999px;background:var(--night3);color:var(--mist);white-space:nowrap}
.tag.moon{background:var(--moon-soft);color:var(--moon)}
.tag.warn{background:rgba(240,163,138,.18);color:var(--warn-text)}
.tag.lock{background:var(--moon-soft);color:var(--moon)}
.alias{font-family:var(--display);font-size:26px;line-height:1.3;margin:4px 0 6px;color:var(--mist)}

.banner{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--night3);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.banner b{font-size:15px}
.banner small{display:block;color:var(--haze);font-size:12px}
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:14px}
.strip div{background:var(--night2);border-radius:10px;padding:6px 0;text-align:center;font-size:11px;color:var(--haze)}
.strip b{display:block;font-size:14px;color:var(--mist);margin-top:2px}
.strip .today{outline:1.5px solid var(--moon)}

.dialwrap{display:flex;flex-direction:column;align-items:center}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;justify-content:center;margin-top:6px;font-size:12px;color:var(--haze)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.times{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;margin-top:14px}
.times div{background:var(--night);border-radius:12px;padding:10px 12px}
.times small{display:block;font-size:12px;color:var(--haze)}
.times b{font-family:var(--display);font-size:22px}

.tl{list-style:none;margin:0;padding:0}
.tl li{display:grid;grid-template-columns:58px 1fr;gap:10px;padding:9px 0;border-bottom:1px solid var(--hair);font-size:14px}
.tl li:last-child{border-bottom:0}
.tl time{font-variant-numeric:tabular-nums;color:var(--moon-text);font-weight:600}
.tl small{display:block;color:var(--haze);font-size:12px}

.feel{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:10px}
.feel button{background:var(--night);border:1.5px solid var(--line);border-radius:12px;min-height:48px;font-size:12px;padding:4px 2px;line-height:1.25}
.feel button[aria-pressed="true"]{border-color:var(--moon);color:var(--moon-text)}
.gap{margin-top:12px;background:var(--night);border-radius:12px;padding:12px 14px;font-size:14px;color:var(--text2)}

.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:10px}
.stats div{background:var(--night);border-radius:12px;padding:10px}
.stats small{display:block;font-size:11.5px;color:var(--haze)}
.stats b{font-size:15px}
.bars{display:flex;align-items:flex-end;gap:8px;height:140px;margin-top:14px}
.bars .b{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;height:100%;justify-content:flex-end}
.bars .stack{width:100%;display:flex;flex-direction:column;justify-content:flex-end;height:100%}
.bars .stack i{display:block;width:100%}
.bars .stack i.m{background:var(--wind);border-radius:0 0 4px 4px}
.bars .stack i.m.ok{background:var(--moon)}
.bars .stack i.n{background:var(--nap);border-radius:6px 6px 0 0;margin-bottom:2px}
.bars .stack i.m:first-child{border-radius:6px 6px 4px 4px}
.bars span{font-size:11px;color:var(--haze)}
.sess{list-style:none;margin:6px 0 0;padding:0}
.sess li{display:flex;justify-content:space-between;gap:8px;font-size:13px;padding:3px 0}
.k-main{color:var(--moon-text)}.k-nap{color:var(--nap)}.k-plan{color:var(--ok-text)}.k-split{color:var(--work)}.k-work{color:var(--warn-text)}.k-ign{color:var(--dim)}

/* calendar */
.calhead{display:flex;align-items:center;justify-content:space-between;margin:6px 0 10px}
.calhead b{font-size:16px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .wd{font-size:11px;color:var(--haze);text-align:center;padding:2px 0}
.cal button{background:var(--night);border:1.5px solid transparent;border-radius:10px;min-height:48px;padding:4px 0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;color:var(--haze)}
.cal button b{font-size:14px;font-weight:600}
.cal button.today{border-color:var(--moon)}
.cal button.flag{border-style:dashed;border-color:var(--warn)}
.cal .empty{visibility:hidden}
.c-D{color:var(--cD)}.c-E{color:var(--cE)}.c-N{color:var(--cN)}.c-O{color:var(--cO)}.c-C{color:var(--cC)}.c-X{color:var(--cX)}

/* program */
.week{width:100%;text-align:left;background:var(--night2);border:0;border-radius:16px;padding:14px 16px;margin-bottom:10px;display:flex;gap:14px;align-items:center}
.week .no{flex:0 0 40px;height:40px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:700;background:var(--night3);color:var(--haze)}
.week.done .no{background:var(--moon);color:var(--moon-ink)}
.week.now .no{border:2px solid var(--moon);color:var(--moon-text)}
.week b{display:block;font-size:15px}
.week small{display:block;font-size:12.5px;color:var(--haze)}
.mod{width:100%;text-align:left;background:var(--night2);border:0;border-radius:16px;padding:16px;margin-bottom:12px;display:block}
.mod .kind{font-size:12px;color:var(--haze)}
.mod b{display:block;font-size:15px;margin:4px 0 8px}
.bar{height:6px;background:var(--night3);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--moon)}
.snd{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--hair)}
.snd:last-child{border-bottom:0}

/* tabbar */
.tabbar{display:grid;background:var(--night2);border-top:1px solid var(--hair);padding:6px 6px 20px}
.tabbar button{background:none;border:0;color:var(--tab);display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;min-height:52px;justify-content:center}
.tabbar button[aria-current="page"]{color:var(--moon-text)}
.tabbar svg{width:22px;height:22px}

.dim{position:absolute;inset:0;background:rgba(8,11,22,.6);display:flex;align-items:flex-end;z-index:20}
.sheet{width:100%;background:var(--night2);border-radius:24px 24px 0 0;padding:10px 22px 28px;max-height:90%;overflow-y:auto}
.sheet{position:relative}
.xbtn{position:absolute;top:10px;right:12px;width:44px;height:44px;border-radius:50%;border:0;background:transparent;color:var(--haze);display:grid;place-items:center}
.xbtn:hover{background:var(--night3)}
.sheet .grab{width:40px;height:4px;background:var(--line);border-radius:4px;margin:4px auto 14px}
.sheet h2{font-family:var(--display);font-size:21px;margin:0 0 6px}
.sheet .card{background:var(--night)}
.toast{position:absolute;left:18px;right:18px;bottom:96px;background:var(--mist);color:var(--night);border-radius:14px;padding:12px 16px;font-size:14px;z-index:30;box-shadow:0 10px 30px -10px rgba(0,0,0,.5)}
.lesson{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--hair)}
.lesson:last-child{border-bottom:0}
.lesson b{display:block;font-size:14.5px}
.lesson p{margin:2px 0 0;font-size:13px;color:var(--haze)}
.slide{background:var(--night);border-radius:16px;padding:18px;min-height:190px}
.slide h3{font-family:var(--display);font-size:19px;margin:0 0 10px}
.slide p{margin:0;color:var(--text2);font-size:14.5px}
.dots{display:flex;gap:6px;justify-content:center;margin:12px 0}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--moon)}
.cmp{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px}
.cmp th,.cmp td{padding:8px 6px;border-bottom:1px solid var(--hair);text-align:center}
.cmp th:first-child,.cmp td:first-child{text-align:left}
.cmp thead th{color:var(--haze);font-weight:500}
.prod{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--night);border-radius:14px;padding:12px 14px;margin-bottom:8px}
.prod b{display:block;font-size:14.5px}
.prod small{display:block;font-size:12px;color:var(--haze)}
.plan{background:var(--night);border:1.5px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:10px}
.plan.best{border-color:var(--moon)}
.plan .pr{font-family:var(--display);font-size:22px;font-weight:700}
.breath{width:120px;height:120px;border-radius:50%;background:var(--wind);margin:12px auto;display:grid;place-items:center;font-size:14px;transition:transform 4s ease-in-out}
.breath.in{transform:scale(1.25)}
.breath.out{transform:scale(.85);transition-duration:6s}
.start-hero{height:100%;display:flex;flex-direction:column;justify-content:space-between;padding:0 26px 32px}
.legal{font-size:12px;color:var(--legal);line-height:1.5;margin-top:14px}
.ocr{background:var(--night);border:1.5px dashed var(--line);border-radius:14px;padding:16px;text-align:center}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}

/* panel */
.panel h2{font-size:18px;margin:0 0 4px}
.panel .intro{color:var(--page-muted);font-size:14px;margin:0 0 18px}
.panel h3{font-size:14px;margin:22px 0 10px;color:var(--page-ink)}
.pbtns{display:flex;flex-wrap:wrap;gap:8px}
.pbtn{border:1px solid var(--panel-line);background:var(--panel-soft);border-radius:10px;padding:8px 12px;font-size:13.5px;min-height:38px}
.pbtn:hover{border-color:var(--page-muted)}
/* ===== 홈 슬롯 ===== */
.slot{margin-top:26px}
.slot+.slot{margin-top:22px}
.sechead{display:flex;align-items:center;gap:8px;width:100%;background:none;border:0;padding:2px 0 8px;text-align:left}
.sechead h3{font-size:15px;margin:0;font-weight:650;letter-spacing:-.01em}
.sechead small{color:var(--haze);font-size:12.5px;font-weight:400}
.sechead .cv{margin-left:auto;color:var(--haze);display:grid;place-items:center;transition:transform .18s}
.sechead .cv.up{transform:rotate(180deg)}
.cardwrap{position:relative}
.cardx{position:absolute;top:10px;right:10px;width:28px;height:28px;border:0;background:none;color:var(--haze);border-radius:8px;display:grid;place-items:center;z-index:2}
.cardx:hover{background:var(--panel-soft);color:var(--text2)}
.focus{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;border-radius:16px;padding:16px;background:var(--moon);color:var(--moon-ink);box-shadow:0 6px 18px rgba(0,0,0,.08)}
.focus .ic{background:rgba(255,255,255,.46);color:inherit;flex:none;box-shadow:inset 0 0 0 1px rgba(255,255,255,.35)}
.focus b{display:block;font-size:16.5px;line-height:1.3}
.focus small{display:block;font-size:12.8px;opacity:.78;margin-top:3px}
.focus .go{margin-left:auto;opacity:.6}
.quiet{opacity:.92}
.screen[data-mode="night"] .focus.quiet{background:var(--night2);color:var(--mist);box-shadow:none;border:1px solid var(--line)}
.screen[data-mode="night"] .focus.quiet .ic{background:rgba(255,255,255,.07)}
.nend{text-align:center;color:var(--haze);font-size:13px;padding:22px 0 8px;line-height:1.7}
.foldmore{width:100%;border:1px dashed var(--panel-line);background:none;color:var(--text2);border-radius:12px;padding:11px;font-size:13.5px;margin-top:10px}
.dstep{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--hair)}
.dstep:last-of-type{border-bottom:0}
.dstep .dt{font-family:var(--display);font-size:13.5px;color:var(--text2);min-width:46px;padding-top:1px}
.dstep .dx{flex:1}
.dstep .dx b{display:block;font-size:14px;font-weight:600}
.dstep .dx small{display:block;color:var(--haze);font-size:12.5px;line-height:1.5;margin-top:2px}
.dstep.past{opacity:.45}
.dstep.now{background:var(--moon-soft);border-radius:10px;padding:9px 10px;border-bottom:0}
.slotnote{color:var(--haze);font-size:12.5px;margin:8px 2px 0;line-height:1.6}
.pbtn.on{background:var(--moon);color:var(--moon-ink);border-color:var(--moon);font-weight:600}
.pbtn.on:hover{border-color:var(--moon)}
.kv{width:100%;border-collapse:collapse;font-size:13.5px}
.kv th,.kv td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--panel-line);vertical-align:top}
.kv th{width:34%;color:var(--page-muted);font-weight:500}
.kv code,.log code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;color:var(--code)}
.tbl-wrap{overflow-x:auto}
.log{list-style:none;margin:0;padding:0;font-size:13px}
.log li{padding:6px 0;border-bottom:1px dashed var(--panel-line);display:flex;gap:10px}
.log time{color:var(--page-muted);font-variant-numeric:tabular-nums;flex:0 0 auto}
.note{background:var(--panel-soft);border-radius:10px;padding:10px 12px;font-size:13px;color:var(--page-muted);margin-top:10px}
.ok-dot,.no-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
.ok-dot{background:#3FA877}.no-dot{background:#C0C6D8}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ===== 가독성 컴포넌트 ===== */
.greet{font-size:14px;color:var(--haze);margin:14px 0 0}
.hero{display:flex;gap:14px;align-items:center;background:var(--moon);color:var(--moon-ink);border-radius:20px;padding:16px;margin:12px 0 14px;border:0;width:100%;text-align:left}
.hero .ic{flex:0 0 48px;height:48px;border-radius:14px;background:rgba(255,255,255,.28);display:grid;place-items:center}
.hero b{display:block;font-size:17px;line-height:1.3}
.hero small{display:block;font-size:13px;opacity:.85;margin-top:2px}
.hero .go{margin-left:auto;flex:0 0 auto;opacity:.8}
.ic{display:inline-grid;place-items:center;width:36px;height:36px;border-radius:12px;background:var(--night3);color:var(--moon-text);flex:0 0 36px}
.ic svg{width:20px;height:20px}
.codebar{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
.cl{background:var(--night);border-radius:12px;padding:10px 4px;text-align:center}
.cl b{display:block;font-family:var(--display);font-size:26px;line-height:1.1;color:var(--mist)}
.cl small{display:block;font-size:11px;color:var(--haze);margin-top:2px}
.cl.bad{background:var(--moon-soft)}
.cl.bad b{color:var(--moon-text)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.tiles.t4{grid-template-columns:repeat(2,1fr)}
.tile{background:var(--night2);border-radius:16px;padding:12px}
.tile small{display:block;font-size:11.5px;color:var(--haze)}
.tile b{display:block;font-size:20px;font-weight:700;margin-top:2px;letter-spacing:-.3px}
.tile em{font-style:normal;font-size:11.5px;color:var(--ok-text)}
.tile em.dn{color:var(--warn-text)}
.band{position:relative;height:30px;background:var(--night3);border-radius:8px;overflow:hidden;margin-top:12px}
.band i{position:absolute;top:0;bottom:0}
.band .now{position:absolute;top:-4px;bottom:-4px;left:0;width:3px;background:var(--mist);border-radius:2px}
.bandlbl{position:relative;height:16px;font-size:11px;color:var(--haze);margin-top:4px}
.bandlbl span{position:absolute;transform:translateX(-50%)}
.hscroll{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;margin:0 -22px 14px;padding-left:22px;padding-right:22px;scroll-snap-type:x mandatory}
.gcard{flex:0 0 200px;scroll-snap-align:start;background:var(--night2);border:0;border-radius:16px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:10px;min-height:128px}
.gcard b{font-size:14.5px;line-height:1.35}
.gcard small{font-size:11.5px;color:var(--haze);margin-top:auto}
.gcard.locked{opacity:.7}
.sectitle{display:flex;justify-content:space-between;align-items:center;margin:4px 0 8px}
.sectitle h3{font-size:15px;margin:0}
.sw{position:relative;width:44px;height:26px;border-radius:13px;border:0;background:var(--line);flex:0 0 44px;padding:0}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .2s}
.sw[aria-checked="true"]{background:var(--moon)}
.sw[aria-checked="true"]::after{left:21px}
.nrow{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--hair)}
.nrow:last-child{border-bottom:0}
.nrow .tm{font-variant-numeric:tabular-nums;font-weight:600;color:var(--moon-text);width:48px;flex:0 0 48px}
.nrow .tx{flex:1;min-width:0;font-size:14px}
.nrow .tx small{display:block;font-size:12px;color:var(--haze)}
.nrow.off .tx,.nrow.off .tm{opacity:.45}
.seg2{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--night2);border-radius:12px;padding:4px;margin-bottom:14px}
.seg2 button{border:0;background:transparent;border-radius:9px;min-height:38px;font-size:14px;color:var(--haze)}
.seg2 button[aria-pressed="true"]{background:var(--night3);color:var(--mist);font-weight:600}
.lockwrap{position:relative}
.lockwrap .blur{filter:blur(5px);pointer-events:none;user-select:none}
.lockov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:16px}
.maprow{display:grid;grid-template-columns:42px 1fr;gap:8px;align-items:center;margin:6px 0;font-size:11.5px;color:var(--haze)}
.maprow .band{height:14px;margin:0;border-radius:4px}
.pair{display:flex;align-items:flex-end;gap:3px;height:100px}
.pair div{flex:1;display:flex;gap:2px;align-items:flex-end;height:100%}
.pair i{flex:1;border-radius:3px 3px 0 0}
.big2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.big2 div{background:var(--night);border-radius:12px;padding:12px;text-align:center}
.big2 b{display:block;font-family:var(--display);font-size:28px}
.big2 small{font-size:12px;color:var(--haze)}
.phase{display:flex;align-items:center;gap:12px}
.chk{display:flex;flex-wrap:wrap;gap:6px}
.chk .chip{min-height:36px;padding:5px 11px;font-size:13px}
.qrow{margin-top:14px}
.qrow>span{display:block;font-size:13px;color:var(--haze);margin-bottom:6px}
.acct{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px}
.acct dt{color:var(--haze)}
.acct dd{margin:0}
.agree-all{display:flex;gap:10px;align-items:center;background:var(--night2);border-radius:14px;padding:14px 16px;font-weight:600;cursor:pointer}
.agree-all input{width:22px;height:22px;accent-color:var(--moon)}
.ag{display:flex;gap:10px;align-items:flex-start;padding:10px 4px;border-bottom:1px solid var(--hair);font-size:14px}
.ag input{width:20px;height:20px;accent-color:var(--moon);flex:0 0 auto;margin-top:1px}
.ag .req{color:var(--moon-text);font-weight:600}
.ag .opt2{color:var(--haze)}
.ag.sub{padding-left:30px;border-bottom:0;font-size:13px}
.share{width:100%;border-collapse:collapse;font-size:12.5px;margin:6px 0 4px}
.share td{padding:6px 4px;border-bottom:1px solid var(--hair);vertical-align:top}
.share th{font-weight:600;text-align:left;padding:6px 4px;color:var(--haze)}
.cardform .field{margin-top:10px}

.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.prow{text-align:left;border:1px solid var(--panel-line);background:var(--panel-soft);border-radius:10px;padding:8px 10px;font-size:13.5px;font-weight:600;min-height:44px}
.prow small{display:block;font-weight:400;font-size:12px;color:var(--page-muted);margin-top:1px}
.prow[aria-pressed="true"]{border-color:var(--page-ink);background:var(--panel)}
.bgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:8px 0 16px}
.bitem{background:var(--night);border:0;border-radius:14px;padding:10px 6px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px}
.bitem b{font-size:12.5px;line-height:1.3}
.bitem small{font-size:11px;color:var(--haze);line-height:1.3}
.bitem.lock b{color:var(--dim)}
.bstrip{display:flex;align-items:center;gap:10px;width:100%;border:0;text-align:left;background:var(--night2);border-radius:16px;padding:12px 14px;margin-bottom:14px}
.bstrip .arts{display:flex;margin-left:auto}
.bstrip .arts svg{margin-left:-8px}
.win{text-align:center;padding-top:8px}
.win h2{margin-top:10px}
.gdone{display:inline-flex;align-items:center;gap:3px;font-size:11px;color:var(--ok-text)}

.intro{height:100%;display:flex;flex-direction:column;padding:28px 26px 30px}
.intro .skip{align-self:flex-end;background:none;border:0;color:var(--haze);font-size:14px;min-height:36px}
.intro .art{flex:1;display:flex;flex-direction:column;justify-content:center;gap:18px}
.intro h1{font-family:var(--display);font-size:27px;line-height:1.35;margin:0;letter-spacing:-.4px}
.intro p{color:var(--text2);font-size:15px;margin:0;line-height:1.6}
.bigic{width:76px;height:76px;border-radius:24px;background:var(--night3);color:var(--moon-text);display:grid;place-items:center}
.bigic svg{width:38px;height:38px}
.mock{background:var(--night2);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:8px}
.mock .row{font-size:13.5px}
.vs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.vs div{background:var(--night2);border-radius:14px;padding:12px;font-size:13px}
.vs b{display:block;font-size:12px;color:var(--haze);margin-bottom:4px}
.why{background:var(--night2);border-radius:16px;padding:14px 16px;margin-bottom:6px}
.why h3{font-size:15px;margin:0 0 4px}
.why .rw{display:flex;gap:12px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--hair)}
.why .rw:last-of-type{border-bottom:0}
.why .rw b{display:block;font-size:14px}
.why .rw span{font-size:13px;color:var(--haze);line-height:1.5}
.nickcard{text-align:center;padding:20px 16px}
.nickname{font-family:var(--display);font-size:25px;line-height:1.35;margin:6px 0 8px;color:var(--mist);word-break:keep-all}
.saja{display:inline-flex;gap:6px;align-items:baseline;font-size:13px;color:var(--haze)}
.saja b{font-family:var(--display);font-size:15px;color:var(--moon-text)}
.cl{padding:9px 4px 7px}
.cl small.ax{font-size:11px;color:var(--haze);margin:0 0 2px}
.cl b{font-family:var(--sans)!important;font-size:14px!important;font-weight:700;line-height:1.25!important;word-break:keep-all}
.cl i{display:block;font-style:normal;font-size:10.5px;color:var(--dim);margin-top:3px;letter-spacing:.5px}
.evolve{background:var(--moon-soft);border-radius:16px;padding:14px 16px;margin-bottom:14px}
.evolve s{color:var(--haze)}

.whyhead{display:flex;gap:12px;align-items:center;width:100%;background:none;border:0;padding:0;color:inherit}
.whyhead b{display:block;font-size:14.5px}
.whyhead small{display:block;font-size:12.5px;color:var(--haze);margin-top:1px}
.whyhead .chev{transition:transform .2s;color:var(--haze)}
.whyhead[aria-expanded="true"] .chev{transform:rotate(90deg)}
.whybody{margin-top:8px}
.login{height:100%;display:flex;flex-direction:column;padding:26px 24px 28px}
.sbtn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:50px;border-radius:14px;border:1px solid var(--line);background:var(--night2);font-weight:600;font-size:15px;margin-bottom:10px}
.sbtn.kakao{background:#FEE500;color:#191600;border-color:#FEE500}
.sbtn.naver{background:#03C75A;color:#fff;border-color:#03C75A}
.sbtn.apple{background:#fff;color:#111;border-color:#D8DCE6}
.sbtn.google{background:#fff;color:#1F1F1F;border-color:#D8DCE6}
.provrow{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--hair)}
.provrow:last-child{border-bottom:0}
.pdot{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;font-size:12px;font-weight:700;flex:none}
.pdot.kakao{background:#FEE500;color:#191600}.pdot.naver{background:#03C75A;color:#fff}
.pdot.apple{background:#111;color:#fff}.pdot.google{background:#fff;color:#1F1F1F;border:1px solid var(--line)}
.pdot.email{background:var(--panel-soft);color:var(--text2)}
.codebox{background:var(--night2);border-radius:14px;padding:12px 14px;margin-top:8px}
.okline{color:var(--ok-text);font-size:13px;margin-top:6px}

.post{background:var(--night);border-radius:14px;padding:12px 14px;margin-bottom:8px}
.post .ph{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--haze);margin-bottom:6px}
.post p{margin:0;font-size:14px;color:var(--text2);line-height:1.55}
.post .pf{display:flex;gap:10px;align-items:center;margin-top:8px}
.cheer{border:1px solid var(--line);background:transparent;border-radius:999px;padding:4px 10px;font-size:12px;min-height:34px;display:inline-flex;align-items:center;gap:5px}
.cheer[aria-pressed="true"]{border-color:var(--moon);color:var(--moon-text)}
.shop{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--hair)}
.shop:last-of-type{border-bottom:0}
.shop .px{margin-left:auto;font-weight:600;font-size:13.5px;white-space:nowrap}
.tripday{display:grid;grid-template-columns:52px 1fr;gap:10px;padding:9px 0;border-bottom:1px solid var(--hair);font-size:13.5px}
.tripday:last-child{border-bottom:0}
.tripday b{color:var(--moon-text)}

.rank{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--hair);font-size:13.5px}
.rank:last-child{border-bottom:0}
.rank .bar2{flex:1;height:8px;background:var(--night3);border-radius:8px;overflow:hidden}
.rank .bar2 i{display:block;height:100%;background:var(--moon);border-radius:8px}
.rank .vv{width:66px;text-align:right;font-weight:600;color:var(--moon-text)}
.wtab{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:8px}
.wtab th,.wtab td{padding:7px 4px;border-bottom:1px solid var(--hair);text-align:center}
.wtab th{color:var(--haze);font-weight:500}
.wtab td:first-child,.wtab th:first-child{text-align:left}
.chal{background:var(--night);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.chal .bar{margin-top:8px}
.promptbox{background:var(--moon-soft);border-radius:14px;padding:12px 14px;margin-bottom:10px;font-size:14px}

.wnote{background:var(--night);border-radius:12px;padding:10px 12px;margin-top:8px;font-size:13.5px}
.wnote small{display:block;color:var(--haze);font-size:12px;margin-top:3px}
.lvl{display:flex;gap:6px;margin-top:6px}
.lvl button{flex:1;border:1.5px solid var(--line);background:transparent;border-radius:10px;min-height:38px;font-size:13px}
.lvl button[aria-pressed="true"]{border-color:var(--moon);color:var(--moon-text);font-weight:600}
.notice{background:var(--moon-soft);border-radius:12px;padding:12px 14px;font-size:13.5px;margin-bottom:14px}
.notice b{display:block;margin-bottom:2px}

.bnr{position:relative;border-radius:18px;overflow:hidden;margin-bottom:14px;background:var(--night2)}
.bnr .slide2{display:flex;gap:12px;align-items:center;padding:14px 16px;width:100%;text-align:left;border:0;background:transparent;min-height:78px}
.bnr .slide2 b{display:block;font-size:14.5px;line-height:1.35}
.bnr .slide2 small{display:block;font-size:12.5px;color:var(--haze);margin-top:2px}
.bnr .kind{font-size:11px;padding:2px 7px;border-radius:999px;background:var(--night3);color:var(--haze);align-self:flex-start;white-space:nowrap}
.bnr .kind.ev{background:var(--moon-soft);color:var(--moon-text)}
.bnr .kind.ad{background:transparent;border:1px solid var(--line)}
.bnr .bdots{display:flex;gap:4px;justify-content:center;padding:0 0 8px}
.bnr .bdots i{width:5px;height:5px;border-radius:50%;background:var(--line)}
.bnr .bdots i.on{background:var(--moon);width:14px;border-radius:3px}
.bnr .bx{position:absolute;top:8px;right:8px;width:30px;height:30px;border:0;background:transparent;color:var(--dim);border-radius:50%}
.ntc{display:flex;gap:10px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--hair);width:100%;text-align:left;background:none;border-left:0;border-right:0;border-top:0}
.ntc b{display:block;font-size:14.5px}
.ntc small{display:block;color:var(--haze);font-size:12px;margin-top:3px}
.ntc .new{width:6px;height:6px;border-radius:50%;background:var(--moon);margin-top:7px;flex:0 0 6px}
.wlist{background:var(--night2);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.wlist .wtop{display:flex;justify-content:space-between;font-size:12px;color:var(--haze);margin-bottom:6px}

/* v5 디자인 */
.bnr{background:var(--night2);box-shadow:0 1px 0 var(--hair) inset}
.bnr.k-이벤트{background:linear-gradient(180deg,var(--moon-soft),var(--night2) 72%)}
.bnr.k-공지{background:var(--night2)}
.bnr.k-프로그램{background:linear-gradient(180deg,rgba(139,145,224,.16),var(--night2) 72%)}
.bnr.k-광고{background:var(--night2);border:1px dashed var(--line)}
.bnr .slide2 .ic{width:44px;height:44px;border-radius:14px;flex:0 0 44px}

/* ===== 화면 테마 =====

function notifQueue(){

function boardArc(){const now=nowMin(),u=upcoming(),segs=[];

  /* 전체 열림이 끝나 가거나 막 끝났을 때만 알린다. 중간에는 말하지 않는다. */

    return wrapX("openEnd",`<div class="card row"><span class="ic">${ic("card")}</span><p style="flex:1;padding-right:22px"><b>${OPEN_DAYS}일 체험이 끝났어요</b><br><span class="muted" style="font-size:13.5px;line-height:1.55">기록과 아침 체크, 짧은 코스는 그대로 쓰실 수 있어요. 심화 분석과 전체 코스만 잠겼어요.</span></p><div style="margin-top:10px"><button class="btn sm" data-a="openPlus">다시 열기</button></div></div>`,"체험 종료 안내 닫기");

  const f=S.flags.find(x=>!dismissed("flag:"+x));
  if(f){const F=FLAGS[f];return wrapX("flag:"+f,`<div class="flagcard"><div class="row"><span class="ic">${ic("bell")}</span><p style="flex:1;padding-right:22px"><b>${F.t}</b><br><span class="muted" style="font-size:13.5px;line-height:1.55">${F.b}</span><br><span class="tag" style="margin-top:8px">${F.care}</span></p></div></div>`,"읽음 표시");}
  if(cl.grade===5&&!dismissed("doc"))return wrapX("doc",`<div class="card row"><span class="ic" style="color:var(--warn-text)">${ic("bell")}</span><p style="flex:1;padding-right:22px"><b>전문가와 이야기해 보세요</b><br><span class="muted" style="font-size:13px">불편이 오래 이어지고 있어요</span></p><button class="btn sm ghost" data-a="openDoc">진료 리포트</button></div>`);

  return "";}

/* --- 오늘 슬롯: 집중 1 + 할 일 2 + 접힘 + 오늘 체크 --- */

    done:!!ck,st:ck?"완료":"하기",a:"openCheck",v:""});

  if(running&&weekStatus(wk.no)==="now"&&courseActive())rows.push({p:3,ic:"book",t:`${wk.no}단계 세션 듣기`,s:`${wk.n} · 10분`,done:false,st:"열기",a:"openWeek",v:wk.no});
  const ok=offKind(k);if(ok)rows.push({p:3.5,ic:"sun",t:OFF_PLAN[ok].t,s:`오늘 할 일 3가지 · ${(S.offDone[k]||[]).length}/3`,done:(S.offDone[k]||[]).length>=3,st:"열기",a:"scrollOff",v:""});
  rows.push({p:(ph==="evening"||ph==="winddown")?1.2:ph==="duty"?9:5,ic:"book",t:"걱정 덜어내기",s:wl.length?`오늘 ${wl.length}개 덜어냄`:"잠자리 밖에서 한 줄",done:wl.length>0,st:wl.length?"완료":"쓰기",a:"openWorry",v:""});
  rows.push({p:(ph==="evening"||ph==="winddown")?1.4:ph==="duty"?9.1:7,ic:PIC[P.cat],t:`지금 해보기 · ${P.n}`,s:`${P.m}분 · ${P.when}`,done:S.act.lastDid["p-"+P.id]===todayK(),st:"시작",a:"openPractice",v:P.id});
  return rows;}
function todaySlot(ph){
  const rows=todoRows(ph),todo=rows.filter(x=>!x.done).sort((a,b)=>a.p-b.p),done=rows.filter(x=>x.done);
  const line=x=>`<button class="titem${x.done?" done":""}" data-a="${x.a}" data-v="${x.v}"><span class="ic">${ic(x.ic)}</span><span style="flex:1"><b>${x.t}</b><small>${x.s}</small></span><span class="st">${x.done?ic("check",16):x.st}</span></button>`;
  let h="";
  if(todo.length){const f=todo[0];
    h+=`<p class="sectitle" style="margin:4px 0 6px"><span style="font-size:13px;color:var(--haze)">${FOCUS_LB[ph]||"지금 가장 중요한 한 가지"}</span></p>
      <button class="focus" data-a="${f.a}" data-v="${f.v}"><span class="ic">${ic(f.ic,24)}</span><span><b>${f.t}</b><small>${f.s}</small></span><span class="go">${ic("arrow")}</span></button>`;}
  const rest=todo.slice(1),head=rest.slice(0,2),hid=rest.slice(2);
  if(rest.length||done.length){
    const pgDots=`${done.length}/${rows.length} 완료<span class="pg" aria-hidden="true">${rows.map((_,i)=>`<i class="${i<done.length?"on":""}"></i>`).join("")}</span>`;
    h+=`<div class="slot">${secHead("todo","오늘 할 일",pgDots)}
      ${folded("todo")?"":`<div class="todo">${head.map(line).join("")}${folded("todoRest")||!hid.length?"":hid.map(line).join("")}${done.length&&!folded("todoRest")?done.map(line).join(""):""}
      ${(hid.length||done.length)?`<button class="foldmore" data-a="fold" data-v="todoRest">${folded("todoRest")?(hid.length?`남은 ${hid.length}개${done.length?` · 마친 ${done.length}개`:""} 더 보기`:`마친 일 ${done.length}개 보기`):"접기"}</button>`:""}</div>`}</div>`;}
  if(!todo.length)h+=`<div class="card"><p>오늘 할 일을 모두 마쳤어요. 남은 건 잘 자는 것뿐이에요.</p></div>`;
  h+=dlogCard();
  return h;}

/* --- 맥락 슬롯: 오늘 상황에만 뜨는 것 --- */
function recShow(){
  if(courseActive()||S.progState==="off"||S.progState==="keep")return false;
  if(dismissed("rec"))return false;
  const age=S.joined?dayDiff(S.joined,todayK()):99;
  if(age<=3)return true;                                  /* 가입 직후 3일은 매일 */
  if(!S.recShownAt)return true;
  return S.recShownAt===todayK()||dayDiff(S.recShownAt,todayK())>=3;}
function recCard(){const c=COURSES[recCourse()],had=S.history.filter(x=>!x.dropped).length;
  return wrapX("rec",`<div class="startcard"><div class="sectitle" style="padding-right:26px"><h3>${had?"다음 코스를 골라 주세요":"아직 시작한 코스가 없어요"}</h3><span class="tag moon">추천</span></div>
    <p style="font-size:14.5px;margin:4px 0 2px"><b>${c.n}</b> · ${c.s}</p><p class="muted" style="font-size:13px;margin:0">${c.d} · ${c.pick}</p>
    <div class="btns" style="margin-top:12px"><button class="btn sm" data-a="againCourse" data-v="${recCourse()}">${c.n} 시작하기</button><button class="btn sm ghost" data-a="tab" data-v="prog">다른 코스 보기</button></div>
    <p class="hint">${recWhy()}</p></div>`,"지금은 안 할래요");}

    h+=`<div class="card" id="off"><div class="sectitle"><h3>${P.t}</h3><span class="tag moon">${dn.length}/3</span></div>${P.todo.map((t,i)=>`<button class="checkrow" data-a="offDone" data-v="${i}" aria-pressed="${dn.includes(i)}"><span class="bx" aria-hidden="true"></span><span>${t}</span></button>`).join("")}</div>`;}

/* --- 배너 슬롯: 중앙 1개. 밤에는 숨김, 광고는 무료 등급에만 --- */

function dutyPlan(){const w=workNow();if(!w)return null;

   {t:w.s+Math.round(w.len*0.55),lb:"앉아서 10분 쉬기",d:"눈을 감고 쉬기만 해도 각성이 돌아와요. 길게 자면 퇴근 후 잠이 얕아져요"},

   {t:w.e-120,lb:"조명·화면 줄이기",d:"퇴근 2시간 전부터 밝은 빛을 피하면 집에 와서 더 잘 자요"},
   {t:w.e,lb:"퇴근 · 선글라스 쓰기",d:`아침 햇빛을 막아야 낮 수면이 깊어져요${lateCaff?` · 커피는 ${fmt(norm(caff))}까지 괜찮아요`:""}`}
  ].sort((a,b)=>a.t-b.t);
  return {w,rows,now,bedAbs,lateCaff};}
function dutyCard(){const P=dutyPlan();if(!P)return "";
  const {w,rows,now}=P,nm=w.night?"야간 근무":"근무 중";

/* --- 3. 근무조별 성적표 --- */
function shiftStats(){const by={};
  S.records.forEach(r=>{const c=r.code||S.roster[r.k];if(!c)return;const x=classifyRecord(r);
    const v=by[c]=by[c]||{n:0,main:0,feel:0,fn:0,lat:0,ln:0};
    v.n++;v.main+=x.mainMin;
    if(r.feel){v.feel+=r.feel;v.fn++;}
    if(x.main&&r.plan){v.lat+=Math.max(0,x.main.s-r.plan.bed);v.ln++;}});
  return Object.entries(by).map(([c,v])=>({c,n:v.n,name:(shiftInfo(c,todayK())||{n:c}).n,
    main:v.main/v.n,feel:v.fn?v.feel/v.fn:null,lat:v.ln?v.lat/v.ln:null}))
    .sort((a,b)=>b.n-a.n);}
function shiftInsight(){const all=shiftStats().filter(x=>x.n>=3),L=all.filter(x=>x.c!=="O");if(L.length<2)return null;
  const best=L.reduce((a,b)=>b.main>a.main?b:a),worst=L.reduce((a,b)=>b.main<a.main?b:a);
  const off=all.find(x=>x.c==="O");
  const offShort=off&&off.main<worst.main-20?{off,gap:Math.round(worst.main-off.main)}:null;
  const gap=Math.round(best.main-worst.main);
  if(gap<30&&!offShort)return null;
  return {best,worst,gap,offShort};}

function sleepDebt(days){const N=days||7,rr=recRange(),need=rr[0];
  const R0=S.records.slice(-N);if(R0.length<3)return null;
  const got=R0.reduce((a,r)=>a+classifyRecord(r).mainMin,0);
  return {n:R0.length,need:need*R0.length,got,debt:Math.max(0,need*R0.length-got),perDay:got/R0.length,target:need};}
function anchorSleep(){if(S.env!=="shift")return null;
  const cov=new Array(1440).fill(0);let days=0;
  for(let d=0;d<7;d++){const k=addDays(todayK(),d);if(!S.roster[k])continue;const p=planFor(k);if(!p.main)continue;days++;
    for(let t=Math.round(p.main.s);t<Math.round(p.main.e);t++)cov[((t%1440)+1440)%1440]++;}
  if(days<4)return null;
  const need=Math.ceil(days*0.6),ok=cov.map(v=>v>=need);
  if(!ok.some(Boolean))return null;
  let best={s:0,len:0};
  for(let s=0;s<1440;s++){if(!ok[s]||ok[(s+1439)%1440])continue;let len=0;while(len<1440&&ok[(s+len)%1440])len++;if(len>best.len)best={s,len};}
  if(best.len<150)return null;
  return {s:best.s,e:(best.s+best.len)%1440,len:best.len,days,need};}
function rhythmCard(){const A=anchorSleep(),D=sleepDebt(7);if(!A&&!D)return "";
  return `<div class="card"><div class="sectitle"><h3>이번 주기 리듬</h3>${D?`<span class="tag ${D.debt>120?"warn":"moon"}">${D.debt?`부족 ${dur(Math.round(D.debt))}`:"충분해요"}</span>`:""}</div>
  ${D?`<p style="font-size:14px;margin:2px 0 8px">최근 ${D.n}일 평균 주수면 <b>${dur(Math.round(D.perDay))}</b> · 권장 하한 ${dur(D.target)}${D.debt?` · 모자란 잠 <b>${dur(Math.round(D.debt))}</b>`:""}</p>`:""}
  ${A?`<div class="nrow"><span class="ic">${ic("moon")}</span><span class="tx"><b>앵커 수면 ${fmt(A.s)} – ${fmt(A.e)}</b><small>앞으로 7일 중 ${A.days}일의 수면 계획이 이 시간대에 겹쳐요. 어떤 근무조든 이 시간엔 눈을 붙이면 리듬이 덜 흔들려요.</small></span></div>`:""}
  ${D&&D.debt>120?`<p class="hint">한 번에 몰아서 갚기보다, 다음 휴무에 ${dur(Math.min(120,Math.round(D.debt)))} 정도만 더 자는 쪽이 리듬에 덜 부담이에요.</p>`:""}

function midSleep(r,x){return ((x.main?x.main.s:r.plan.bed)+(x.main?x.main.e:r.plan.wake))/2;}
const FACTORS={
 caf:{n:"오후 카페인",hi:2,ic:"coffee",metric:"lat",mn:"잠들기까지",good:"less",tip:"카페인은 취침 6시간 전까지",tipA:"openPractice",tipV:"env"},

 st:{n:"높은 스트레스",hi:2,ic:"wind",metric:"feel",mn:"개운함",good:"more",tip:"걱정 덜어내기로 머릿속 비우기",tipA:"openWorry",tipV:""},
 sun:{n:"햇빛 쬔 날",hi:1,ic:"sun",metric:"feel",mn:"개운함",good:"more",tip:"아침 빛 10분",tipA:"openPractice",tipV:"light"},
 screen:{n:"자기 전 휴대폰",hi:2,ic:"bell",metric:"lat",mn:"잠들기까지",good:"less",tip:"잠들기 전 루틴으로 바꾸기",tipA:"openPractice",tipV:"wind"},
 toilet:{n:"밤에 화장실",hi:1,ic:"bed",metric:"wake2",mn:"깬 횟수",good:"less",tip:"저녁 수분 조절",tipA:"openArt",tipV:"a6"},
 drowsy:{n:"근무 중 졸음",hi:1,ic:"alarm",metric:"main",mn:"주수면",good:"more",tip:"근무 전 수면 블록 확보하기",tipA:"goRoster",tipV:""}};
function metricOf(r,x,key){const ck=S.checkin[r.k]||{};
  if(key==="lat"){if(!x.main)return null;if(ck.inBed){const ib=toMin(ck.inBed);return Math.max(0,x.main.s-(ib>x.main.s?ib-1440:ib));}return Math.max(0,x.main.s-r.plan.bed);}

function factorStat(list,key){const F=FACTORS[key];if(!F)return null;
  const cr=list.map(classifyRecord),A=[],B=[];

/* ===== 왜 잠이 어려운지 — 오늘 체크 5문항 + 최근 7일 수면 + 걱정 노트를 합쳐 본다 =====
   진단하지 않는다. 기록에서 보이는 패턴과 바꿔 볼 행동만 말한다. */
function tibOf(r,x){const ck=S.checkin[r.k]||{},ib=ck.inBed?toMin(ck.inBed):r.plan.bed;
  const st=ib>x.main.s?ib-1440:ib;return Math.max(1,x.main.e-st);}
function circSD(mins){if(mins.length<2)return 0;
  const rad=mins.map(m=>m/1440*2*Math.PI);
  const C=rad.reduce((a,x)=>a+Math.cos(x),0)/rad.length,Si=rad.reduce((a,x)=>a+Math.sin(x),0)/rad.length;
  const Rv=Math.min(1,Math.sqrt(C*C+Si*Si));
  return Math.sqrt(-2*Math.log(Math.max(1e-9,Rv)))/(2*Math.PI)*1440;}
function whyFacts(){
  const A=winRecs(WINDOW.short);
  if(A.length<WINDOW.shortMin)return {short:true,n:A.length,need:WINDOW.shortMin};
  const F=[],avg=a=>a.reduce((p,q)=>p+q,0)/a.length;
  const lat=[],eff=[],tst=[],tib=[],nap=[];
  A.forEach(({r,c})=>{const ck=S.checkin[r.k]||{},ib=ck.inBed?toMin(ck.inBed):r.plan.bed;
    const st=ib>c.main.s?ib-1440:ib;
    lat.push(Math.max(0,c.main.s-st));const t=tibOf(r,c);
    tib.push(t);eff.push(c.mainMin/t*100);tst.push(c.mainMin);nap.push(c.splitMin||0);});
  const L=avg(lat),E=avg(eff),T=avg(tst),TB=avg(tib),NP=avg(nap);
  const over=lat.filter(v=>v>=30).length;
  if(L>=30)F.push({w:L,t:"누운 뒤 잠들기까지 오래 걸려요",
    e:`최근 ${A.length}일 평균 ${Math.round(L)}분이 걸렸고, 그중 ${over}일은 30분을 넘었어요.`,
    a:"졸릴 때만 눕고, 20분쯤 잠이 오지 않으면 잠시 일어났다가 다시 졸릴 때 누워 보세요.",ac:"openPractice",av:"wind"});
  if(E<85&&TB-T>=30)F.push({w:(85-E)*4,t:"누워 있는 시간에 비해 실제로 잔 시간이 짧아요",
    e:`평균 ${dur(Math.round(TB))} 누워 ${dur(Math.round(T))} 잤어요. 차이가 ${Math.round(TB-T)}분이에요.`,
    a:"누워 있는 시간을 조금 줄이면 잠이 더 촘촘해져요. 눕는 시각을 15분만 늦춰 보세요.",ac:"openSleepPref",av:""});
  if(NP>=45)F.push({w:NP,t:"낮에 자는 시간이 밤잠을 밀어내고 있어요",
    e:`최근 ${A.length}일 동안 밤잠 말고 평균 ${Math.round(NP)}분을 더 잤어요.`,
    a:"낮에 자고 싶으면 오후 3시 전에 20분 안으로 끊어 보세요.",ac:"openArt",av:"a5"});
  const B=winRecs(WINDOW.long);
  if(B.length>=WINDOW.longMin){const sd=circSD(B.map(x=>x.c.main.e%1440));
    if(sd>=60)F.push({w:sd,t:"일어나는 시간이 날마다 달라요",

      nap:i<2?"오후 2시 전 20분까지":"낮에 자지 않고 버티기"});}
  return out;}

function wAgg(){const all=allWorries(),days=Object.keys(S.worries).filter(k=>worriesOf(k).length).sort();
  const done=all.filter(x=>x.real!=null),real=done.filter(x=>x.real===1),night=all.filter(x=>x.night);
  let st=0,k=todayK();if(!worriesOf(k).length)k=addDays(k,-1);
  while(worriesOf(k).length&&st<400){st++;k=addDays(k,-1);}
  return {all,days,done:done.length,real:real.length,night:night.length,streak:st,
    rate:done.length?Math.round(real.length/done.length*100):null,
    nightPct:all.length?Math.round(night.length/all.length*100):0,
    avg:all.length?all.reduce((a,x)=>a+x.lvl,0)/all.length:0};}
function wTopics(all){const m={};all.forEach(x=>{const o=m[x.topic]=m[x.topic]||{n:0,sum:0,done:0,real:0};o.n++;o.sum+=x.lvl;if(x.real!=null){o.done++;if(x.real===1)o.real++;}});
  return Object.entries(m).map(([t,o])=>({t,n:o.n,sum:o.sum,done:o.done,real:o.real,avg:o.sum/o.n})).sort((a,b)=>b.n-a.n);}
function wRepeat(all){const g={};all.forEach(x=>{(g[x.t]=g[x.t]||[]).push(x);});
  return Object.entries(g).filter(([,v])=>v.length>=2).map(([t,v])=>{const ks=v.map(x=>x.k).sort();
    return {ex:t,t:v[0].topic,n:v.length,days:new Set(ks).size,hi:v.filter(x=>x.lvl>=4).length,
      mx:Math.max(...v.map(x=>x.lvl)),first:ks[0],last:ks[ks.length-1],
      done:v.filter(x=>x.real!=null).length,real:v.filter(x=>x.real===1).length};})
    .sort((a,b)=>b.n-a.n||b.mx-a.mx).slice(0,6);}
function wSleepLink(){const hi=[],lo=[];
  S.records.slice(-28).forEach(r=>{const l=worriesOf(r.k);if(!l.length)return;const c=classifyRecord(r);if(!c.main)return;
    const s=l.reduce((a,x)=>a+x.lvl,0),o={lat:Math.max(0,Math.round(c.main.s-r.plan.bed)),feel:r.feel||3};
    (s>=8?hi:lo).push(o);});

  return {enough:hi.length>=3&&lo.length>=3,hiN:hi.length,loN:lo.length,
    hiLat:Math.round(av(hi,"lat")),loLat:Math.round(av(lo,"lat")),hiFeel:av(hi,"feel"),loFeel:av(lo,"feel")};}
function wWeeks(){const out=[];for(let w=3;w>=0;w--){let s=0,n=0,d=0;
  for(let i=0;i<7;i++){const l=worriesOf(addDays(todayK(),-(w*7+i)));s+=l.reduce((a,x)=>a+x.lvl,0);n+=l.length;if(l.length)d++;}
  out.push({w,s,n,d});}return out;}
function wTodo(A,T,RP,L){const out=[],sl=T.find(x=>x.t==="잠");
  if(sl&&sl.n>=3)out.push(["잠에 대한 걱정이 "+sl.n+"번 돌아왔어요","누운 뒤 15분이 지나도 잠이 안 오면 침대에서 나오기 — 자극 조절과 함께 쓰면 ‘잠 걱정’이 줄어요."]);
  if(A.nightPct>=25)out.push(["한밤중에 떠오른 메모가 "+A.nightPct+"%","저녁 걱정 시간을 10분 고정해 보세요. 밤에 떠오른 건 한 줄만 적고 다시 눕는 게 좋아요."]);
  if(RP.length)out.push(["같은 걱정이 "+RP[0].n+"번 돌아왔어요","“"+RP[0].ex+"” — "+md(RP[0].first)+"부터 "+RP[0].days+"일에 걸쳐 적었어요. 반복되는 건 걱정이 아니라 ‘할 일’일 수 있어요 — 다음 한 걸음 한 줄을 붙여 보세요."]);
  if(L.enough&&L.hiLat-L.loLat>=8)out.push(["무거운 밤에 잠들기까지 "+(L.hiLat-L.loLat)+"분 더","무게 4~5가 보이는 날은 걱정 시간을 30분 더 이르게 가져가 보세요."]);
  if(A.done<Math.round(A.all.length*0.6))out.push(["되짚지 않은 걱정 "+(A.all.length-A.done)+"개","‘걱정대로 됐나요?’까지 눌러야 ‘대부분 그렇게 되지 않았다’가 내 숫자로 남아요."]);

  return out.slice(0,3);}

  b:["자는 동안 뇌는 쉬는 게 아니라 일합니다. 낮에 들어온 정보 중 남길 것을 고르고, 나머지를 지웁니다. 시험 전날 밤을 새우면 공부한 양은 늘지만 남는 양은 줄어드는 이유예요.","깊은 잠 동안에는 뇌 속 노폐물이 씻겨 나가고, 렘수면 동안에는 감정의 날이 무뎌집니다. 같은 일을 겪어도 잘 잔 다음 날 덜 괴로운 건 기분 탓만은 아니에요.","잠이 모자라면 배고픔 신호가 커지고 포만 신호는 줄어듭니다. 늦은 밤 야식이 당기는 건 의지가 약해서가 아니라 잠이 모자라서인 경우가 많아요."]},
 {id:"a2",c:"why",t:"몇 시간 자야 충분할까",m:3,s:"시간보다 중요한 세 가지",
  k:["성인 7~9시간, 65세 이상 7~8시간이 기준","사람마다 다르고, 낮의 컨디션이 최종 기준이에요","같은 시간에 일어나는 것이 시간 길이보다 중요해요"],
  b:["권장 범위는 성인 7~9시간, 65세 이상 7~8시간입니다. 다만 이건 평균이고, 6시간 반으로 개운한 사람도 9시간이 필요한 사람도 있습니다.","판단 기준은 숫자가 아니라 낮입니다. 오후에 심하게 졸리지 않고, 주말에 몰아 자지 않아도 된다면 지금 시간이 나에게 맞는 겁니다.","시간보다 중요한 건 일정함이에요. 같은 시간에 일어나면 잠의 압력과 몸의 시계가 같은 곳을 가리키게 되고, 그때 잠이 가장 쉽게 옵니다."]},
 {id:"a3",c:"how",t:"잠이 오게 두는 법",m:4,s:"애쓸수록 멀어지는 이유",
  k:["잠은 노력으로 만드는 게 아니라 조건을 갖추면 오는 것","졸릴 때만 눕고, 20분 지나면 잠시 일어나요","침대에서는 잠만 자요"],
  b:["잠은 재우려 할수록 달아납니다. ‘자야 한다’는 생각이 각성을 올리기 때문이에요. 할 일은 재우는 게 아니라 올 수 있는 조건을 만드는 겁니다.","졸릴 때만 눕는 것이 첫 번째 조건입니다. 졸리지 않은데 누워 있으면 뇌가 침대를 ‘깨어서 고민하는 곳’으로 배웁니다.","누운 지 20분쯤 지나도 잠이 오지 않으면 잠시 일어나세요. 어두운 조명 아래 조용히 있다가 졸릴 때 돌아갑니다. 처음 며칠은 번거롭지만, 이 연결을 되돌리는 가장 빠른 방법입니다."]},
 {id:"a4",c:"how",t:"아침 빛이 밤잠을 만든다",m:3,s:"빛의 타이밍이 전부",
  k:["일어나서 30분 안에 밝은 빛을 쬐세요","저녁엔 조명을 낮추고 화면 밝기를 줄여요","교대근무자는 퇴근길 선글라스가 중요해요"],
  b:["몸의 시계는 빛으로 맞춰집니다. 아침 빛은 시계를 앞당겨 밤에 일찍 졸리게 만들고, 밤의 빛은 반대로 밉니다.","아침에 커튼을 열고 10분만 밖을 보세요. 흐린 날의 야외도 실내 조명보다 훨씬 밝습니다.","야간 근무 뒤 퇴근길 아침 햇빛은 ‘지금은 아침’이라는 신호를 줘서 낮 수면을 방해합니다. 선글라스 하나가 낮 수면의 질을 바꿉니다."]},
 {id:"a5",c:"dont",t:"술은 수면제가 아니에요",m:3,s:"빨리 잠들지만 얕아지는 밤",
  k:["잠드는 시간은 줄지만 후반부 잠이 깨집니다","새벽 각성과 화장실을 늘려요","잠들기 3시간 전부터 피하는 게 좋아요"],
  b:["술은 분명 빨리 잠들게 합니다. 문제는 그다음입니다. 알코올이 분해되면서 후반부 잠이 얕아지고 새벽에 자주 깨게 됩니다.","술을 마신 밤은 기록상 수면 시간이 비슷해도 다음 날 개운함이 떨어지는 경우가 많습니다. 솜즈:라이프의 ‘오늘 하루 한 줄’로 직접 확인해 보세요.","잠을 위해 마시는 술은 점점 양이 늘어납니다. 잠들기 어려운 문제는 술이 아니라 행동으로 푸는 게 안전합니다."]},
 {id:"a6",c:"dont",t:"누워서 보는 휴대폰",m:2,s:"밝기보다 더 큰 문제",
  k:["빛보다 ‘각성’이 더 큰 문제예요","침대에서 보면 침대가 깨어 있는 곳이 됩니다","알림은 끄고 손이 닿지 않는 곳에 두세요"],
  b:["화면의 빛도 영향이 있지만, 더 큰 문제는 내용입니다. 뉴스·메시지·영상은 뇌를 깨웁니다.","침대에서 휴대폰을 보면 침대와 각성이 연결됩니다. 침대는 잠자는 곳으로만 남겨 두세요.","가장 쉬운 방법은 충전기를 침대에서 먼 곳에 두는 것입니다."]},
 {id:"a7",c:"aid",t:"수면 보조제, 어떻게 볼까",m:4,s:"약·건기식·멜라토닌 정리",
  k:["약국 수면유도제는 단기용이고, 내성과 다음 날 졸림이 있어요","건강기능식품은 ‘수면의 질 개선’ 기능성을 인정받은 원료가 따로 있어요","처방 수면제는 임의로 끊지 말고 의사와 상의하세요"],
  b:["약국에서 사는 수면유도제(항히스타민 계열)는 짧은 기간 도움이 될 수 있지만, 반복하면 효과가 줄고 다음 날 멍함이 남을 수 있습니다. 일주일 넘게 이어 쓰고 있다면 약사·의사와 상의하세요.","건강기능식품 중에는 식약처가 ‘수면의 질 개선’ 기능성을 인정한 원료가 있습니다. 감태추출물, 미강주정추출물, 유단백가수분해물(락티움) 같은 것들이에요. 효과의 크기는 사람마다 다르고, 행동을 바꾸지 않으면 오래가기 어렵습니다.","처방 수면제를 쓰고 있다면 솜즈:라이프는 끊으라고 하지 않습니다. 행동을 함께 바꾸면 약을 줄일 수 있는 경우가 있지만, 그 판단과 조절은 반드시 의사와 함께 하세요.","어떤 보조제든 ‘잠이 안 오는 이유’를 대신 해결해 주지는 못합니다. 보조제는 다리이지 목적지가 아닙니다."]},
 {id:"a8",c:"env",t:"침실은 조금 서늘하게",m:2,s:"온도·빛·소음 기준",
  k:["18~21도 정도가 편해요","완전한 어둠이 좋고, 안 되면 안대","일정한 소리는 변하는 소리보다 낫습니다"],
  b:["잠들 때 몸 안의 온도는 떨어집니다. 방이 더우면 이 과정이 방해받아 뒤척이게 됩니다. 조금 서늘하다 싶은 정도가 적당해요.","빛은 적을수록 좋습니다. 암막 커튼이 어렵다면 안대만으로도 꽤 달라집니다. 교대근무로 낮에 자야 한다면 암막은 선택이 아니라 필수에 가깝습니다.","소음은 완전히 없애기 어렵습니다. 그럴 땐 백색소음처럼 일정한 소리로 덮는 쪽이 갑자기 들리는 소리보다 낫습니다."]},
 {id:"a9",c:"case",t:"교대근무, 포기하지 않는 법",m:4,s:"바꿀 수 없는 조건 안에서",
  k:["근무조마다 자는 시간이 달라지는 건 정상이에요","매일 겹치는 4시간(앵커 수면)을 지켜요","빛과 근무 전 수면으로 버팁니다"],
  b:["교대근무자에게 ‘매일 같은 시간에 자라’는 조언은 현실적이지 않습니다. 대신 근무조에 맞춰 자는 시간을 설계하는 게 맞습니다.","근무가 바뀌어도 매일 겹치는 4시간을 정해 그 시간엔 누워 있는 방식(앵커 수면)이 도움이 됩니다.","야간 근무 중에는 근무 초반에 밝은 빛을, 퇴근길에는 선글라스를. 근무 3시간 전 30분 수면은 졸음을 눈에 띄게 줄입니다."]},
 {id:"a10",c:"case",t:"시차, 며칠이면 돌아올까",m:3,s:"방향에 따라 다릅니다",
  k:["동쪽으로 이동(미국→한국)이 더 힘들어요","하루 1시간씩 앞당기는 게 현실적이에요","첫날 늦게 잠드는 건 정상입니다"],
  b:["시차 적응은 방향에 따라 다릅니다. 서쪽으로 갈 때(늦게 자기)는 비교적 쉽고, 동쪽으로 돌아올 때(일찍 자기)가 어렵습니다.","미국에서 한국으로 돌아오면 몸은 아직 현지 시각이라 한국의 밤에 잠이 오지 않습니다. 첫날은 늦게 잠드는 걸 인정하고 하루 1시간씩 앞당기세요.","아침 햇빛은 시계를 앞당깁니다. 돌아온 뒤 며칠은 오전에 밖에서 30분을 보내 보세요."]}];

 {id:"bk1",t:"밤의 도서관",a:"에세이 · 발췌",m:8,d:"조용한 도서관에서 보낸 하룻밤",p:"도서 앱 제휴"},
 {id:"bk2",t:"느린 여행기",a:"여행 에세이 · 발췌",m:10,d:"기차 창밖으로 흘러가는 풍경",p:"도서 앱 제휴"},
 {id:"bk3",t:"어린 날의 여름",a:"소설 · 1장",m:12,d:"시골 할머니 집에서의 방학",p:"도서 앱 제휴"},

 {id:"bk5",t:"바다 우체국",a:"동화 · 낭독",m:14,d:"편지를 배달하는 등대지기",p:"오디오북 제휴"},

 {id:"v1",c:"명상",t:"잠들기 전 10분 명상",m:10,d:"호흡과 몸에 머무르기"},
 {id:"v2",c:"명상",t:"몸 훑어보기 명상",m:15,d:"발끝에서 머리까지"},
 {id:"v3",c:"명상",t:"생각 흘려보내기",m:8,d:"생각이 멈추지 않을 때"},
 {id:"v4",c:"운동",t:"자기 전 스트레칭",m:7,d:"허리·목·어깨 풀기"},
 {id:"v5",c:"운동",t:"침대 위 요가",m:12,d:"누운 채로 하는 다섯 동작"},

function bookSheet(id){return ()=>{const B=BOOKS.find(x=>x.id===id);S.readArt=S.readArt||{};S.readArt["bk-"+id]=todayK();
  return dimWrap(B.t,`<span class="tag moon">${B.p}</span><h2 style="margin-top:10px">${B.t}</h2><p class="sub">${B.a} · ${B.m}분 분량</p>
  <div class="artbody"><p>${B.d}.</p>
  <p>창밖에서는 빗소리가 들렸다. 누군가 조용히 책장을 넘기는 소리, 멀리서 들려오는 발소리. 세상의 소음이 한 겹씩 멀어지는 동안 문장은 점점 느려졌다.</p>
  <p>읽다가 눈이 감기면 그대로 두세요. 다 읽지 않아도 괜찮아요. 내일 밤 이어서 읽으면 됩니다.</p></div>
  <div class="btns"><button class="btn sm ghost" data-a="bookAudio" data-v="${id}">낭독으로 듣기</button><button class="btn sm" data-a="closeSheet">여기까지 읽기</button></div>
  <p class="legal">${B.p==="솜즈:라이프 오리지널"?"솜즈:라이프가 직접 만든 이야기예요.":"제휴 도서 앱의 일부를 솜즈:라이프에서 읽을 수 있어요. 전체 내용은 제휴 앱에서 이어볼 수 있어요."} 화면 밝기를 낮추고 읽어 주세요.</p>`);};}
function videoSheet(id){return ()=>{const V=VIDEOS.find(x=>x.id===id);S.readArt=S.readArt||{};S.readArt["v-"+id]=todayK();
  return dimWrap(V.t,`<span class="tag moon">${V.c}</span><h2 style="margin-top:10px">${V.t}</h2><p class="sub">${V.m}분 · ${V.d}</p>
  <div class="vid" style="height:180px"><span class="pbtn">${ic("arrow",22)}</span><span style="position:absolute;bottom:10px;left:14px;font-size:12px;color:var(--haze)">${V.m}분 영상 (데모)</span></div>
  <p style="font-size:14px;color:var(--text2);line-height:1.6">누운 채로 화면을 보며 따라 하셔도 돼요. 끝까지 보지 않고 잠들어도 괜찮아요. 소리는 서서히 작아집니다.</p>
  <div class="btns"><button class="btn sm ghost" data-a="vidAudio" data-v="${id}">화면 끄고 소리만</button><button class="btn sm" data-a="closeSheet">마치기</button></div>`);};}
function booksList(){return `<p class="muted" style="font-size:13px;margin:0 0 10px">잠들기 전 10분, 끝까지 읽지 않아도 되는 이야기예요.</p>
  ${BOOKS.map(B=>`<button class="bookcard" data-a="openBook" data-v="${B.id}"><span class="cover">${B.t.slice(0,4)}</span><span style="flex:1"><b>${B.t}</b><small>${B.a} · ${B.m}분</small><small>${B.p}${S.readArt&&S.readArt["bk-"+B.id]?" · 읽는 중":""}</small></span>${ic("arrow")}</button>`).join("")}
  <p class="legal">도서 앱 제휴 콘텐츠는 제휴사 정책에 따라 바뀔 수 있어요.</p>`;}
function videoList(){const c=UI.vcat||"전체",cats=["전체","명상","운동","호흡"];
  return `<div class="seg" style="margin-bottom:10px">${cats.map(x=>chip("vcat",x,c===x,x)).join("")}</div>
  ${VIDEOS.filter(v=>c==="전체"||v.c===c).map(V=>`<button class="vidcard" data-a="openVideo" data-v="${V.id}"><span class="vidthumb">${ic(V.c==="명상"?"moon":V.c==="운동"?"spark":"wind",26)}<span class="pb">${ic("arrow",18)}</span><span class="len">${V.m}분</span></span><span class="vt"><b>${V.t}</b><small>${V.c} · ${V.d}</small></span></button>`).join("")}`;}
function artSheet(id){return ()=>{const A=ARTS.find(x=>x.id===id),cat=(ART_CAT.find(c=>c[0]===A.c)||[])[1];
  S.readArt=S.readArt||{};S.readArt[id]=todayK();
  return dimWrap(A.t,`<span class="tag moon">${cat} · ${A.m}분</span><h2 style="margin-top:10px">${A.t}</h2><p class="sub">${A.s}</p>
  ${(()=>{const F={a1:"press",a2:"press",a3:"bed",a4:"light",a5:null,a6:"bed",a7:null,a8:null,a9:"light",a10:null,a11:"caf",a12:"light"}[A.id];
    return F?`<div class="fig">${FIGS[F]}</div>`:`<div class="illo">${ic({why:"moon",how:"sun",dont:"coffee",aid:"card",env:"bed",case:"cal"}[A.c]||"book",48)}</div>`;})()}
  ${A.id==="a1"||A.id==="a9"?`<div class="vid"><span class="pbtn">${ic("arrow",22)}</span><span style="position:absolute;bottom:10px;left:14px;font-size:12px;color:var(--haze)">3분 영상 (데모)</span></div>`:""}
  <div class="keybox"><b>핵심만</b><ul style="margin:0;padding-left:18px">${A.k.map(x=>`<li>${x}</li>`).join("")}</ul></div>

function applyPattern(){if(S.pattern&&S.todayCode)return setRoster(buildFromPattern(S.pattern,S.todayCode),"pattern","반복 패턴");return "";}
const HOLD_CAP=31; /* 이미 결제한 1개월치의 남은 기간만 보관 */
function holdSub(){ /* 개인 → 기업 전환 시 개인 구독 보관 */
  if(S.ent.plus&&S.ent.until){const d=Math.min(HOLD_CAP,Math.max(0,dayDiff(todayK(),S.ent.until)));
    if(d>0)S.ent.held={kind:"premium",name:"프리미엄",days:d,at:todayK()};
    log("sub_held",`프리미엄 ${d}일 보관 · 자동 갱신 중지 · 환불 없음`);}
  else if(promoOn()){const d=Math.min(HOLD_CAP,Math.max(0,dayDiff(todayK(),S.ent.promoUntil)));
    if(d>0)S.ent.held={kind:"trial",name:S.ent.promoName||"체험",days:d,at:todayK()};
    log("sub_held",`체험 ${d}일 보관`);}
  S.ent.plus=false;S.ent.plan=null;S.ent.until=null;S.ent.promoUntil=null;S.ent.cancelAt=null;S.ent.paused=null;}
function restoreSub(){const H=S.ent.held;if(!H)return null;S.ent.held=null;
  if(H.kind==="premium"){S.ent.plus=true;S.ent.plan="보관 복원";S.ent.until=addDays(todayK(),H.days);
    S.ent.cancelAt=S.ent.until;S.ent.askContinue=true;} /* 자동 결제 없음 — 계속 여부를 물어봄 */
  else{S.ent.promoUntil=addDays(todayK(),H.days);S.ent.promoName=H.name;}
  log("sub_restored",`${H.name} ${H.days}일 복원 · 자동 결제 없음`);return H;}
function keepSub(){S.ent.cancelAt=null;S.ent.cancelReason=null;S.ent.askContinue=false;log("sub_kept","해지 예약 취소 · 구독 유지");}
function doCancel(r){S.ent.cancelAt=subEnd();S.ent.cancelReason=r||null;S.ent.paused=null;
  log("sub_cancel_scheduled",`${md(S.ent.cancelAt)} 해지 예약 · 사유 ${r||"미선택"} · 환불 없음`);}
function pauseSub(m){S.ent.paused={months:m,from:subEnd(),until:addDays(subEnd(),m*30)};S.ent.cancelAt=null;S.ent.offerUsed=true;
  log("sub_paused",`${md(S.ent.until)} 이후 ${m}개월 결제 미룸 · ${md(S.ent.paused.until)} 자동 재개`);}
function unpauseSub(){const m=S.ent.paused?S.ent.paused.months:0;S.ent.paused=null;log("sub_unpaused",`쉬기 취소 · ${m}개월 미루기 해제`);}
function grant(){S.ent.plus=true;S.ent.plan="월간";S.ent.until=addDays(todayK(),30);S.ent.cancelAt=null;S.ent.cancelReason=null;S.ent.paused=null;S.ent.askContinue=false;}

  if(k==="lPw"||k==="lPw2"){const ok=/^(?=.*[A-Za-z])(?=.*\d).{8,}$/.test(UI.pw||"");UI.pwOk=ok&&UI.pw===UI.pw2&&/\S+@\S+\.\S+/.test(S.member.email);UI.pwMsg=!ok?"영문과 숫자를 포함해 8자 이상이어야 해요.":UI.pw!==UI.pw2?"비밀번호가 서로 달라요.":!/\S+@\S+\.\S+/.test(S.member.email)?"이메일 형식을 확인해 주세요.":"사용할 수 있어요.";
    const b=app.querySelector('[data-a="obNext"]');if(b)b.disabled=!UI.pwOk;const m=document.getElementById("pwmsg");if(m){m.textContent=UI.pwMsg;m.className=UI.pwOk?"hint":"err";}}
  if(k==="corpCode"){UI.keepBody=true;render();const el=app.querySelector("#ccode");if(el){el.focus();el.setSelectionRange(el.value.length,el.value.length);}}
  save();});
app.addEventListener("change",e=>{const el=e.target;
  if(el.dataset.in){if(el.type==="time"){UI.keepBody=true;UI.keepScroll=true;render();}return;}
  const c=el.dataset.chk;if(!c)return;const[g,key]=c.split(":");
  if(g==="ag"){if(key==="all"){const on=el.checked;Object.keys(S.agree).forEach(k=>{if(k!=="push"&&(S.channel==="b2b"||!["corpVerify","corpShare"].includes(k)))S.agree[k]=on;});}
    else{S.agree[key]=el.checked;if(key==="mkt")["mktPush","mktSms","mktEmail"].forEach(k=>S.agree[k]=el.checked);if(["mktPush","mktSms","mktEmail"].includes(key))S.agree.mkt=S.agree.mktPush||S.agree.mktSms||S.agree.mktEmail;}
    UI.keepBody=true;render();return;}
  if(g==="cj"){UI.cj.share=el.checked;return;}
  if(g==="lg"){UI.lg=Object.assign(UI.lg||{},{keep:el.checked});return;}
  if(g==="q"){UI.q=Object.assign(UI.q||{},{agree:el.checked});render();return;}
  if(g==="sp"){UI.sp=Object.assign(UI.sp||{},{weekend:el.checked});return;}
  if(g==="ui"){UI[key]=el.checked;render();return;}
});

let bt=null;
function startBreath(){const reduce=window.matchMedia("(prefers-reduced-motion: reduce)").matches;let ph=0,cnt=0;
  const step=()=>{const el=document.getElementById("breath");if(!el){stopBreath();return;}if(cnt>=6){el.className="breath";el.textContent="잘하셨어요";stopBreath();S.act.breath++;const hh=new Date().getHours();if(hh>=1&&hh<5)S.act.breath3am=true;if(checkBadges().length)render();else save();return;}
    if(ph===0){el.className="breath"+(reduce?"":" in");el.textContent="들이쉬기 4초";bt=setTimeout(step,4000);}else{el.className="breath"+(reduce?"":" out");el.textContent="내쉬기 6초";bt=setTimeout(step,6000);cnt++;}ph=1-ph;};bt=setTimeout(step,600);}
function stopBreath(){clearTimeout(bt);bt=null;}

      {c:"b4",round:1,from:addDays(todayK(),-70),to:addDays(todayK(),-42),b:{d:"",avg:352,hit:3,feel:2.8,code:"LBVD",bad:4},a:{d:"",avg:381,hit:4,feel:3.3,code:"LBRD",bad:3}},
      {c:"c6",round:1,from:addDays(todayK(),-40),to:addDays(todayK(),-2),b:{d:"",avg:381,hit:4,feel:3.3,code:"LBRD",bad:3},a:{d:"",avg:402,hit:5,feel:3.9,code:"QCRE",bad:0}}];
      S.tab="prog";UI.sheet=null;log("demo","3회차 히스토리");}
    render();return;}
  const sb=e.target.closest("[data-sess]");
  if(sb){const r=sb.dataset.sess;S.screen="login";S.auth={auto:false};UI.sheet=null;UI.lg={step:"main",reason:r,prov:r==="unlink"?((S.member.login&&S.member.login!=="이메일")?S.member.login:"카카오"):null};log("session_expired",({logout:"로그아웃",device:"새 기기",expire:"90일 미접속",unlink:"소셜 연결 해제",pw:"비밀번호 변경"})[r]);render();return;}
  const ob=e.target.closest("[data-os]");if(ob){S.os=ob.dataset.os;if(S.source==="wearable"&&S.platform){S.platform=S.os==="ios"?"Apple Watch":"Galaxy Watch";}log("os_changed",S.os);render();return;}
  const hr=e.target.closest("[data-hr]");if(hr){S.resign={state:"pending",reason:hr.dataset.hr==="resign"?"회사 재직자 명부에서 제외됨":"6개월 회사 이메일 재인증 실패",left:6};S.corp.employed=false;S.agree.corpShare=false;log("resign_detected",`${S.resign.reason} · 회사 제공 즉시 중단`);UI.sheet=null;render();return;}
  const b=e.target.closest("[data-p]");if(!b)return;const p=b.dataset.p;stopNoise();
  UI={sheet:null,toast:"",card:0,ocr:"idle",calM:0,playing:null,showSup:false,draft:null,modeOverride:null,flip:{}};
  if(p==="reset"){S=fresh();render();return;}
  loadPersona(p);render();
});
