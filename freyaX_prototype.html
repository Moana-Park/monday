<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>freyaX 프로토타입 — 회원가입에서 개인화 메인화면까지</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EDF0EC;
  --grid:#DDE4DD;
  --card:#FBFCFA;
  --ink:#16204A;
  --ink-2:#4E5B7E;
  --ink-3:#8A93AC;
  --line:#D3D9D8;
  --fertile:#D6255E;
  --menses:#8C2F3D;
  --follicular:#1F8C80;
  --luteal:#6A54A8;
  --amber:#D2841F;
  --ok:#1F8C80;
  --sperm:#2B4C8C;
  --shadow:0 1px 0 rgba(22,32,74,.06), 0 18px 40px -24px rgba(22,32,74,.45);
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --sans:'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  --serif:'Gowun Batang','Nanum Myeongjo',serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:var(--sans);color:var(--ink);
  background-color:var(--paper);
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size:28px 28px, 28px 28px;
  display:flex;justify-content:center;align-items:flex-start;
  gap:26px;padding:26px 18px 60px;flex-wrap:wrap;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
:focus-visible{outline:2px solid var(--fertile);outline-offset:2px}

/* ── 좌측 브리프 ─────────────────────────── */
.brief{width:250px;padding-top:14px}
.brief .mark{font-family:var(--mono);font-size:11px;letter-spacing:.22em;color:var(--ink-3);text-transform:uppercase}
.brief h1{font-family:var(--serif);font-size:31px;line-height:1.18;font-weight:700;margin:10px 0 12px;letter-spacing:-.01em}
.brief p{font-size:12.5px;line-height:1.75;color:var(--ink-2)}
.brief .legend{margin-top:22px;border-top:1px solid var(--line);padding-top:14px}
.brief .legend b{font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--ink-3);display:block;margin-bottom:9px}
.swatch{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--ink-2);margin-bottom:6px}
.swatch i{width:11px;height:11px;border-radius:2px;display:block}

/* ── 폰 프레임 ───────────────────────────── */
.phone{
  width:392px;height:800px;border-radius:34px;background:var(--card);
  box-shadow:var(--shadow);position:relative;overflow:hidden;
  border:1px solid var(--line);display:flex;flex-direction:column;flex:0 0 auto;
}
.statusbar{height:34px;display:flex;align-items:center;justify-content:space-between;
  padding:0 20px;font-family:var(--mono);font-size:10.5px;color:var(--ink-3);flex:0 0 auto}
.screen{flex:1;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin}
.screen::-webkit-scrollbar{width:5px}
.screen::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}
.pad{padding:0 22px 26px}

/* ── 공용 요소 ───────────────────────────── */
.eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.2em;color:var(--ink-3);text-transform:uppercase}
.h-serif{font-family:var(--serif);font-weight:700;letter-spacing:-.01em}
.btn{display:block;width:100%;padding:15px;border-radius:13px;background:var(--ink);color:#fff;
  font-size:14.5px;font-weight:600;transition:transform .12s ease, opacity .12s ease}
.btn:hover{transform:translateY(-1px)}
.btn[disabled]{opacity:.28;transform:none;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink-2);border:1px solid var(--line);font-weight:500}
.opt{display:flex;align-items:center;gap:11px;width:100%;text-align:left;padding:14px 15px;
  border:1px solid var(--line);border-radius:12px;background:#fff;margin-bottom:8px;
  font-size:14px;color:var(--ink);transition:border-color .12s, background .12s}
.opt:hover{border-color:var(--ink-3)}
.opt .dot{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--ink-3);flex:0 0 auto;position:relative}
.opt.sel{border-color:var(--ink);background:#F3F5FB}
.opt.sel .dot{border-color:var(--ink);background:var(--ink);box-shadow:inset 0 0 0 3px #fff}
.opt.sq .dot{border-radius:4px}
.card{background:#fff;border:1px solid var(--line);border-radius:15px;padding:16px;margin-bottom:11px}
.tag{display:inline-block;font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;
  padding:3px 7px;border-radius:5px;background:#EEF1F8;color:var(--ink-2)}
.tag.hot{background:#FBE9EF;color:var(--fertile)}
.tag.amb{background:#FBF0E0;color:var(--amber)}
.tag.ok{background:#E4F2F0;color:var(--ok)}

/* ── 온보딩 ─────────────────────────────── */
.intro{padding:52px 30px 30px;height:100%;display:flex;flex-direction:column}
.intro .plot{height:150px;margin:26px 0 30px;position:relative}
.intro h2{font-family:var(--serif);font-size:29px;line-height:1.38;font-weight:700;margin-bottom:14px}
.intro p{font-size:13.5px;line-height:1.85;color:var(--ink-2)}
.dots{display:flex;gap:6px;margin:auto 0 18px}
.dots i{width:22px;height:3px;border-radius:2px;background:var(--line);display:block;transition:background .2s}
.dots i.on{background:var(--ink)}

/* ── 설문 ───────────────────────────────── */
.qhead{padding:12px 22px 18px}
.prog{height:3px;background:var(--line);border-radius:2px;overflow:hidden;margin-bottom:14px}
.prog>i{display:block;height:100%;background:var(--ink);transition:width .3s cubic-bezier(.4,0,.2,1)}
.qtitle{font-family:var(--serif);font-size:22px;line-height:1.45;font-weight:700;margin:8px 0 6px}
.qsub{font-size:12px;color:var(--ink-3);line-height:1.65;margin-bottom:18px}
.numwrap{text-align:center;padding:14px 0 6px}
.numval{font-family:var(--mono);font-size:56px;font-weight:500;letter-spacing:-.03em}
.numval span{font-size:17px;color:var(--ink-3);margin-left:4px}
input[type=range]{width:100%;accent-color:var(--ink);margin-top:14px}
.bodygrid{display:flex;gap:11px}
.bodygrid>div{flex:1;border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:#fff}
.bodygrid label{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;color:var(--ink-3);display:block}
.bodygrid input{width:100%;border:none;font-family:var(--mono);font-size:26px;font-weight:500;
  color:var(--ink);background:transparent;margin-top:4px}
.bodygrid input:focus{outline:none}
.bmiout{text-align:center;font-family:var(--mono);font-size:12px;color:var(--ink-2);margin-top:12px}

/* ── 규칙 트리 연산 ──────────────────────── */
.trace{padding:40px 24px}
.trace h3{font-family:var(--serif);font-size:20px;margin-bottom:4px}
.trace .sub{font-size:12px;color:var(--ink-3);margin-bottom:24px}
.rule{display:flex;gap:11px;align-items:flex-start;padding:9px 0;opacity:.2;
  transition:opacity .28s;border-bottom:1px dashed var(--line)}
.rule.shown{opacity:1}
.rule .code{font-family:var(--mono);font-size:11px;color:var(--ink-3);width:26px;flex:0 0 auto;padding-top:1px}
.rule .txt{font-size:12.5px;line-height:1.6;color:var(--ink-2);flex:1}
.rule .res{font-family:var(--mono);font-size:10px;color:var(--ink-3);flex:0 0 auto;padding-top:2px}
.rule.hit .txt{color:var(--ink);font-weight:600}
.rule.hit .res{color:var(--fertile)}

/* ── 결과 ───────────────────────────────── */
.result{padding:34px 24px 24px}
.stagecode{font-family:var(--mono);font-size:12px;letter-spacing:.2em;color:var(--fertile)}
.stagename{font-family:var(--serif);font-size:28px;font-weight:700;line-height:1.3;margin:8px 0 12px}
.friring{display:flex;align-items:center;gap:18px;margin:18px 0}
.friring .n{font-family:var(--mono);font-size:44px;font-weight:500;letter-spacing:-.03em;line-height:1}
.bars{margin-top:6px}
.barrow{display:flex;align-items:center;gap:9px;margin-bottom:7px;font-size:11.5px}
.barrow .lb{width:74px;color:var(--ink-2);flex:0 0 auto}
.barrow .tr{flex:1;height:5px;background:#E9ECEA;border-radius:3px;overflow:hidden}
.barrow .tr>i{display:block;height:100%;background:var(--ink);border-radius:3px}
.barrow .vl{font-family:var(--mono);font-size:10.5px;color:var(--ink-3);width:26px;text-align:right}

/* ── 홈 ─────────────────────────────────── */
.hometop{display:flex;justify-content:space-between;align-items:flex-start;padding:6px 22px 14px}
.hometop .who{font-size:12px;color:var(--ink-3);line-height:1.5}
.hometop .who b{display:block;font-size:15px;color:var(--ink);font-weight:600;margin-top:2px}
.hero{border-radius:18px;padding:20px;margin-bottom:12px;position:relative;overflow:hidden;
  background:#fff;border:1px solid var(--line)}
.hero.dark{background:var(--ink);border-color:var(--ink);color:#fff}
.hero.dark .eyebrow{color:rgba(255,255,255,.5)}
.ringwrap{display:flex;align-items:center;gap:18px}
.ringtxt .big{font-family:var(--mono);font-size:34px;font-weight:500;letter-spacing:-.02em;line-height:1.05}
.ringtxt .lbl{font-size:12px;color:var(--ink-2);margin-top:5px;line-height:1.5}
.hero.dark .ringtxt .lbl{color:rgba(255,255,255,.66)}
.slot{margin-bottom:11px}
.slotlbl{display:flex;align-items:center;gap:8px;margin:18px 0 9px}
.slotlbl .eyebrow{flex:0 0 auto}
.slotlbl .rule{flex:1;height:1px;background:var(--line);border:none;padding:0;opacity:1}
.todo{display:flex;align-items:flex-start;gap:11px;padding:13px 15px;background:#fff;
  border:1px solid var(--line);border-radius:12px;margin-bottom:7px;text-align:left;width:100%}
.todo .chk{width:17px;height:17px;border-radius:5px;border:1.5px solid var(--ink-3);flex:0 0 auto;margin-top:1px;
  display:flex;align-items:center;justify-content:center;font-size:10px;color:#fff}
.todo.done .chk{background:var(--ok);border-color:var(--ok)}
.todo.done .t{text-decoration:line-through;color:var(--ink-3)}
.todo .t{font-size:13.5px;font-weight:500;line-height:1.45}
.todo .s{font-size:11.5px;color:var(--ink-3);margin-top:2px;line-height:1.5}
.todo.urgent{border-color:var(--amber);background:#FDF8F0}
.ctt{display:flex;gap:11px;padding:12px;background:#fff;border:1px solid var(--line);
  border-radius:12px;margin-bottom:7px;align-items:center}
.ctt .ic{width:38px;height:38px;border-radius:9px;background:#EEF1F8;flex:0 0 auto;
  display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:14px;color:var(--ink-2)}
.ctt .t{font-size:13px;font-weight:500;line-height:1.4}
.ctt .s{font-size:11px;color:var(--ink-3);margin-top:2px}
.warn{border-left:3px solid var(--amber);background:#FDF8F0;padding:13px 15px;border-radius:0 11px 11px 0;
  font-size:12.5px;line-height:1.65;color:#7A5514;margin-bottom:11px}
.quiet{border-left:3px solid var(--luteal);background:#F4F2FA;padding:13px 15px;border-radius:0 11px 11px 0;
  font-size:12.5px;line-height:1.65;color:#463374;margin-bottom:11px}

/* ── 하단 탭 ─────────────────────────────── */
.tabs{flex:0 0 auto;display:flex;border-top:1px solid var(--line);background:#fff}
.tabs button{flex:1;padding:11px 0 15px;font-size:10px;color:var(--ink-3);
  display:flex;flex-direction:column;align-items:center;gap:5px}
.tabs button .g{width:17px;height:17px;border:1.4px solid currentColor;border-radius:5px}
.tabs button.on{color:var(--ink);font-weight:600}
.tabs button.on .g{background:var(--ink);border-color:var(--ink)}

/* ── 캘린더 ─────────────────────────────── */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:10px}
.cal .dow{font-family:var(--mono);font-size:9px;color:var(--ink-3);text-align:center;padding-bottom:5px}
.cal .d{aspect-ratio:1;border-radius:8px;display:flex;flex-direction:column;align-items:center;
  justify-content:center;font-family:var(--mono);font-size:11px;color:var(--ink-2);background:#F5F7F5}
.cal .d.m{background:#F6E6E9;color:var(--menses)}
.cal .d.f{background:#FBE3EB;color:var(--fertile);font-weight:600}
.cal .d.o{background:var(--fertile);color:#fff;font-weight:600}
.cal .d.l{background:#F0EDF9;color:var(--luteal)}
.cal .d.today{box-shadow:inset 0 0 0 1.5px var(--ink)}
.cal .d i{width:3px;height:3px;border-radius:50%;background:currentColor;margin-top:2px;display:block}
.calleg{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.calleg span{font-size:10.5px;color:var(--ink-2);display:flex;align-items:center;gap:5px}
.calleg i{width:9px;height:9px;border-radius:3px;display:block}

/* ── 챌린지 ─────────────────────────────── */
.phase{border:1px solid var(--line);border-radius:13px;padding:14px;margin-bottom:9px;background:#fff}
.phase .ph{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.phase .ph b{font-size:13.5px;font-weight:600}
.phase .ph span{font-family:var(--mono);font-size:10px;color:var(--ink-3)}
.phase ul{list-style:none;font-size:12px;color:var(--ink-2);line-height:1.85}
.phase ul li:before{content:'—';color:var(--ink-3);margin-right:7px}
.phase.now{border-color:var(--ink);box-shadow:0 0 0 2px #EEF1F8}
.gauge{height:7px;background:#E9ECEA;border-radius:4px;overflow:hidden;margin:12px 0 6px}
.gauge>i{display:block;height:100%;background:linear-gradient(90deg,var(--follicular),var(--fertile))}

/* ── 인스펙터 ───────────────────────────── */
.insp{width:280px;font-size:11.5px;padding-top:14px}
.insp h4{font-family:var(--mono);font-size:10px;letter-spacing:.18em;color:var(--ink-3);
  text-transform:uppercase;margin-bottom:10px}
.insp .box{background:rgba(255,255,255,.72);border:1px solid var(--line);border-radius:12px;
  padding:13px;margin-bottom:11px}
.kv{display:flex;justify-content:space-between;gap:10px;padding:4px 0;border-bottom:1px dotted var(--line)}
.kv:last-child{border:none}
.kv b{font-weight:500;color:var(--ink-2);font-size:11px}
.kv span{font-family:var(--mono);font-size:11px;color:var(--ink);text-align:right}
.caseswitch{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-top:4px}
.caseswitch button{padding:8px 6px;border:1px solid var(--line);border-radius:8px;background:#fff;
  font-family:var(--mono);font-size:10px;color:var(--ink-2);text-align:left;line-height:1.4}
.caseswitch button:hover{border-color:var(--ink-3)}
.caseswitch button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.caseswitch button em{font-style:normal;display:block;font-family:var(--sans);font-size:9.5px;opacity:.7;margin-top:1px}
.reset{width:100%;padding:9px;border:1px dashed var(--line);border-radius:9px;
  font-size:11px;color:var(--ink-3);background:transparent}

@media (max-width:1000px){
  body{padding:18px 14px 50px}
  .brief,.insp{width:min(392px,100%)}
}
</style>
</head>
<body>

<aside class="brief">
  <div class="mark">freyaX · prototype v1.0</div>
  <h1>몸의 주기를<br>읽는 법부터.</h1>
  <p>회원가입 설문 12문항으로 사용자를 10개 케이스 중 하나로 분류하고, 그 케이스에 맞는 메인화면을 띄웁니다. 오른쪽 패널에서 분류 규칙과 점수 계산이 실시간으로 어떻게 도는지 확인할 수 있습니다.</p>
  <div class="legend">
    <b>CYCLE PHASE</b>
    <div class="swatch"><i style="background:#8C2F3D"></i>생리기</div>
    <div class="swatch"><i style="background:#1F8C80"></i>난포기</div>
    <div class="swatch"><i style="background:#D6255E"></i>가임기 · 배란일</div>
    <div class="swatch"><i style="background:#6A54A8"></i>황체기</div>
    <div class="swatch"><i style="background:#2B4C8C"></i>정자 생성주기 (남성 90일)</div>
  </div>
</aside>

<div class="phone">
  <div class="statusbar"><span>9:41</span><span id="sbRight">freyaX</span></div>
  <div class="screen" id="screen"></div>
  <nav class="tabs" id="tabs" style="display:none"></nav>
</div>

<aside class="insp">
  <h4>Engine Inspector</h4>
  <div class="box" id="inspA">
    <div class="kv"><b>상태</b><span>대기 중</span></div>
  </div>
  <h4>Case Switcher</h4>
  <div class="box">
    <div class="caseswitch" id="switcher"></div>
    <button class="reset" id="resetBtn" style="margin-top:9px">설문부터 다시 시작</button>
  </div>
</aside>

<script>
/* ═══════════════════════════════════════════════════════════
   freyaX Prototype — 엔진 A(분류) · B(가임 준비 지수) · C(주기 예측) · D(모듈 배치)
   ═══════════════════════════════════════════════════════════ */

const S = { gender:null, a:{}, qi:0, stage:null, rule:null, why:'', fri:null, layers:[], tab:'home',
            intro:0, view:'intro', done:{}, demo:false };

/* ── 설문 정의 ───────────────────────────── */
const QF = [
 {id:'age',type:'num',min:24,max:45,def:32,unit:'세',t:'만 나이를 알려주세요',
  s:'35세를 기준으로 난임 검사 권고 시점이 달라집니다.'},
 {id:'stage',type:'single',t:'지금 어떤 단계인가요?',s:'가장 가까운 하나를 골라주세요.',o:[
   ['start','이제 막 준비를 시작했어요'],['trying','자연임신을 시도하고 있어요'],
   ['clinic','병원에서 검사·상담 중이에요'],['iui','인공수정(IUI)을 준비/진행 중이에요'],
   ['ivf','시험관(IVF)을 준비/진행 중이에요'],['rest','시술을 쉬는 중이에요']]},
 {id:'ttp',type:'single',t:'임신을 시도한 기간은 얼마나 됐나요?',s:'피임하지 않고 시도한 기간 기준입니다.',
  when:a=>['start','trying','clinic'].includes(a.stage),o:[
   ['0','3개월 미만'],['3','3~6개월'],['6','6~12개월'],['12','1~2년'],['24','2년 이상']]},
 {id:'round',type:'single',t:'몇 차수째인가요?',s:'차수별 커뮤니티와 일정 템플릿을 맞춰드립니다.',
  when:a=>['iui','ivf'].includes(a.stage),o:[['1','1차'],['2','2차'],['3','3차 이상']]},
 {id:'proto',type:'single',t:'프로토콜을 알고 계신가요?',s:'모르셔도 괜찮습니다. 일정만으로도 관리할 수 있어요.',
  when:a=>a.stage==='ivf',o:[['long','장기요법'],['short','단기요법'],['nat','자연주기'],['unknown','잘 모르겠어요']]},
 {id:'restplan',type:'single',t:'다음 차수 계획이 있으신가요?',s:'답에 따라 알림 빈도를 조절합니다.',
  when:a=>a.stage==='rest',o:[['yes','일정이 잡혀 있어요'],['undecided','아직 미정이에요'],['pause','당분간 쉬려고 해요']]},

function redFlags(a){
  const f=[];
  if(a.cycle==='irr') f.push('주기 변동 8일 이상');
  if(a.cycle==='long') f.push('주기 35일 초과');
  if(a.cycle==='none') f.push('3개월 이상 무월경');
  const dx=a.dx||[];
  const nm={pcos:'다낭성난소증후군',endo:'자궁내막증',tube:'난관 이상',dor:'난소기능저하',thyroid:'갑상선 질환',mc2:'반복 유산'};
  dx.forEach(d=>{ if(nm[d]) f.push(nm[d]); });
  if(a.sa==='abnormal') f.push('정액검사 이상 소견');
  if(Number(a.age)>=38) f.push('만 38세 이상');
  return f;
}

function classify(a){
  const age=Number(a.age||32);
  const ttp = a.ttp!=null ? Number(a.ttp) : (['iui','ivf','rest'].includes(a.stage)?24:0);
  const flags=redFlags(a);
  const R=(i,stage,why)=>({hit:i,stage,why,flags});
  if(a.stage==='ivf')  return R(1,'S4','시험관(IVF) 진행·준비를 직접 선택했습니다.');
  if(a.stage==='iui')  return R(2,'S3','인공수정(IUI) 진행·준비를 직접 선택했습니다.');
  if(a.stage==='rest') return R(3,'S5','시술을 쉬는 중이라고 답하셨습니다.');
  if(a.stage==='clinic') return R(4,'S2','병원 검사·상담 단계에 계십니다.');
  if(age<35 && ttp>=12) return R(5,'S2','35세 미만 기준 12개월 이상 시도하셨습니다.');
  if(age>=35 && ttp>=6) return R(5,'S2','35세 이상 기준 6개월 이상 시도하셨습니다.');
  if(ttp>=3 && flags.length>0) return R(6,'S2','시도 3개월 이상이면서 위험신호가 확인됐습니다: '+flags[0]);
  return R(7,'S1','아직 임상 기준상 검사 시점이 아닙니다. 타이밍 최적화 단계입니다.');
}

/* ── 엔진 B · 가임 준비 지수 ──────────────── */
function bmiOf(a){ const h=Number(a.h||0)/100,w=Number(a.w||0); return (h>0&&w>0)?w/(h*h):null; }
function d2Score(b){ if(b==null) return 70;
  if(b<18.5) return 60; if(b<23) return 100; if(b<25) return 85;
  if(b<27.5) return 70; if(b<30) return 55; return 35; }
function friOf(a,g){
  const b=bmiOf(a), age=Number(a.age||32);
  const ttp = a.ttp!=null?Number(a.ttp):24;
  let d1;
  if(g==='F') d1={reg:95,mild:70,long:58,irr:42,none:20,unknown:60}[a.cycle]??60;
  else d1={normal:100,abnormal:55,unsure:60,never:30}[a.sa]??30;
  const d2=d2Score(b);
  let d3;
  if(g==='F'){
    const diet={good:100,skip:55,late:45,diet:70}[a.diet]??60;
    const ex={'0':35,'1':65,'3':90,'5':100}[a.ex]??50;
    const sl={'5':40,'6':65,'7':95,'8':90}[a.sleep]??60;
    d3=Math.round((diet+ex+sl)/3);
  }else{
    const base={good:95,mid:70,low:45,irr:40}[a.ex]??60;
    const h=a.habit||[]; let pen=0;
    if(h.includes('smoke'))pen+=25; if(h.includes('drink'))pen+=12;
    if(h.includes('sauna'))pen+=10; if(h.includes('sit'))pen+=8;
    d3=Math.max(15,base-pen);
  }
  const flags=redFlags(a).length;
  const d4=Math.max(30,100-15*flags);
  let d5=100;
  if(age>=38)d5=40; else if(age>=36)d5=60; else if(age>=33)d5=80;
  if(ttp>=24)d5=Math.max(20,d5-20);
  const d6=50;
  const W = g==='F' ? {d1:.25,d2:.20,d3:.25,d4:.15,d5:.10,d6:.05}
                    : {d1:.20,d2:.20,d3:.30,d4:.15,d5:.10,d6:.05};
  const total=Math.round(d1*W.d1+d2*W.d2+d3*W.d3+d4*W.d4+d5*W.d5+d6*W.d6);
  const dom=[{k:g==='F'?'주기 안정성':'검사 이행도',v:d1,w:W.d1},{k:'체성분',v:d2,w:W.d2},
             {k:'생활습관',v:d3,w:W.d3},{k:'위험요인',v:d4,w:W.d4},
             {k:'시간 압박',v:d5,w:W.d5},{k:'참여도',v:d6,w:W.d6}];
  const actionable = g==='F' ? ['체성분','생활습관'] : ['체성분','생활습관','검사 이행도'];
  const weak=[...dom].filter(d=>actionable.includes(d.k))
                     .sort((x,y)=>((100-y.v)*y.w)-((100-x.v)*x.w))[0] || dom[0];
  const gain=Math.max(3,Math.round((100-weak.v)*weak.w*0.65));
  return {total,dom,weak,gain,bmi:b};
}

/* ── 엔진 C · 주기·배란 예측 ──────────────── */
function cycleModel(a){
  const map={reg:{len:28,sd:1.5},mild:{len:30,sd:4},long:{len:36,sd:5},irr:{len:38,sd:9},none:{len:null,sd:null},unknown:{len:29,sd:5}};
  const m=map[a.cycle]||map.unknown;
  const pcos=(a.dx||[]).includes('pcos');
  const confirmMode = m.sd===null || m.sd>8 || pcos;
  const w = m.sd? Math.min(8,Math.max(3,Math.round(2*m.sd))) : null;
  return {...m,confirmMode,width:w,pcos};
}

/* ── 레이어 ─────────────────────────────── */
function layersOf(a,g){
  const L=[]; const b=bmiOf(a);
  if(Number(a.parity||0)>0) L.push({k:'P1+',t:'둘째 이상 준비'});
  const f=redFlags(a); if(f.length) L.push({k:'R',t:'위험신호 '+f.length+'개'});
  if(b!=null&&b>=25) L.push({k:'BMI+',t:'체중 관리 우선'});
  if(b!=null&&b<18.5) L.push({k:'BMI−',t:'저체중 · 감량 차단'});
  if(a.partner==='now') L.push({k:'L',t:'파트너 연결됨'});
  if((a.dx||[]).includes('pcos')) L.push({k:'PCOS',t:'배란 확인 모드'});
  return L;
}

const el=(h)=>{const d=document.createElement('div');d.innerHTML=h.trim();return d.firstElementChild;};
const scr=document.getElementById('screen');
const tabsEl=document.getElementById('tabs');
function paint(html){scr.innerHTML=html;scr.scrollTop=0;}

function ringSVG(cm,day){
  const len=cm.len||30, r=44, C=2*Math.PI*r;
  const seg=(f,t,c)=>{const a=(f/len)*C,b=((t-f)/len)*C;
    return `<circle cx="56" cy="56" r="${r}" fill="none" stroke="${c}" stroke-width="9"
      stroke-dasharray="${b} ${C-b}" stroke-dashoffset="${-a}" transform="rotate(-90 56 56)"/>`;};
  const ov=len-14, f1=Math.max(0,ov-5), f2=ov+1;
  const ang=(day/len)*360-90, rad=ang*Math.PI/180;
  const mx=56+Math.cos(rad)*r, my=56+Math.sin(rad)*r;
  return `<svg width="112" height="112" viewBox="0 0 112 112">
    <circle cx="56" cy="56" r="${r}" fill="none" stroke="#E9ECEA" stroke-width="9"/>
    ${seg(0,5,'#8C2F3D')}${seg(5,f1,'#1F8C80')}${seg(f1,f2,'#D6255E')}${seg(f2,len,'#6A54A8')}
    <circle cx="${mx}" cy="${my}" r="6.5" fill="#fff" stroke="#16204A" stroke-width="2.5"/>
  </svg>`;
}
function spermBar(d){
  const p=Math.min(100,d/90*100), fp=74/90*100;
  return `<div style="margin-top:4px">
    <div style="height:11px;border-radius:6px;background:#E9ECEA;position:relative;overflow:hidden">
      <div style="position:absolute;left:0;top:0;bottom:0;width:${fp}%;background:#DCE3F0"></div>
      <div style="position:absolute;left:${fp}%;top:0;bottom:0;right:0;background:#EDE4F3"></div>
      <div style="position:absolute;left:0;top:0;bottom:0;width:${p}%;background:var(--sperm);border-radius:6px"></div>
    </div>
    <div style="display:flex;justify-content:space-between;font-family:var(--mono);font-size:9px;color:var(--ink-3);margin-top:6px">
      <span>D0 형성 시작</span><span>D74 성숙</span><span>D90 완료</span></div></div>`;
}

/* ── 화면: 설문 ─────────────────────────── */
function renderQ(){
  const list=q();
  if(S.qi>=list.length){ S.view='trace'; return renderTrace(); }
  const Q=list[S.qi], pct=Math.round(S.qi/list.length*100);
  let body='';
  if(Q.type==='single'||Q.type==='multi'){
    const cur=S.a[Q.id];
    body=Q.o.map(([v,l])=>{
      const sel=Q.type==='multi'?((cur||[]).includes(v)):(cur===v);
      return `<button class="opt ${Q.type==='multi'?'sq':''} ${sel?'sel':''}" data-v="${v}"><span class="dot"></span><span>${l}</span></button>`;
    }).join('');
  } else if(Q.type==='num'){
    const v=S.a[Q.id]??Q.def;
    body=`<div class="numwrap"><div class="numval" id="nv">${v}<span>${Q.unit}</span></div>
      <input type="range" id="rg" min="${Q.min}" max="${Q.max}" value="${v}"></div>`;
  } else if(Q.type==='body'){
    body=`<div class="bodygrid">
      <div><label>HEIGHT (cm)</label><input id="ih" type="number" value="${S.a.h??163}"></div>
      <div><label>WEIGHT (kg)</label><input id="iw" type="number" value="${S.a.w??72}"></div></div>
      <div class="bmiout" id="bo"></div>`;
  }
  const canNext = Q.type==='num'||Q.type==='body' || (Q.type==='multi'? (S.a[Q.id]||[]).length>0 : !!S.a[Q.id]);
  paint(`<div class="qhead">
      <div class="prog"><i style="width:${pct}%"></i></div>
      <div style="display:flex;justify-content:space-between;align-items:center">
        <button class="eyebrow" id="bk" style="letter-spacing:.14em">${S.qi>0?'← 이전':''}</button>
        <span class="eyebrow">${String(S.qi+1).padStart(2,'0')} / ${String(list.length).padStart(2,'0')}</span></div>
      <div class="qtitle">${Q.t}</div>${Q.s?`<div class="qsub">${Q.s}</div>`:'<div style="height:10px"></div>'}
    </div>
    <div class="pad">${body}
      <button class="btn" id="nx" style="margin-top:18px" ${canNext?'':'disabled'}>다음</button></div>`);

  const next=()=>{S.qi++;renderQ();};
  const nb=document.getElementById('nx');
  scr.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{
    if(Q.type==='multi'){
      let cur=S.a[Q.id]||[]; const v=b.dataset.v;
      if(v==='none'){cur=['none'];}
      else{ cur=cur.filter(x=>x!=='none');
        cur = cur.includes(v)? cur.filter(x=>x!==v) : (Q.max&&cur.length>=Q.max? cur : [...cur,v]); }
      S.a[Q.id]=cur; renderQ();
    } else { S.a[Q.id]=b.dataset.v; setTimeout(next,170); }
  });
  const rg=document.getElementById('rg');
  if(rg){ S.a[Q.id]=S.a[Q.id]??Q.def;
    rg.oninput=()=>{document.getElementById('nv').innerHTML=rg.value+`<span>${Q.unit}</span>`;S.a[Q.id]=rg.value;}; }
  const ih=document.getElementById('ih');
  if(ih){ const iw=document.getElementById('iw'), bo=document.getElementById('bo');
    const up=()=>{S.a.h=ih.value;S.a.w=iw.value;const b=bmiOf(S.a);
      bo.textContent=b?`BMI ${b.toFixed(1)} · ${b<18.5?'저체중':b<23?'정상':b<25?'과체중 경계':b<27.5?'과체중':'비만'}`:'';};
    ih.oninput=up;iw.oninput=up;up(); }
  if(nb) nb.onclick=next;
  const bk=document.getElementById('bk');
  if(bk) bk.onclick=()=>{ if(S.qi>0){S.qi--;renderQ();} };
  updateInsp();
}

function renderTrace(){
  const r=classify(S.a);
  S.stage=r.stage; S.rule='R'+r.hit; S.why=r.why;
  S.fri=friOf(S.a,S.gender); S.layers=layersOf(S.a,S.gender);
  paint(`<div class="trace">
    <div class="eyebrow">ENGINE A · RULE TREE</div>
    <h3 style="margin-top:8px">분류 규칙을 확인하고 있습니다</h3>
    <div class="sub">위에서부터 평가해, 처음 만족하는 규칙에서 멈춥니다.</div>
    <div id="rl">${RULES.map((x,i)=>`<div class="rule" data-i="${i}">
      <span class="code">${x[0]}</span><span class="txt">${x[1]}</span><span class="res">${x[2]}</span></div>`).join('')}</div>
    <div id="fin" style="opacity:0;transition:opacity .4s;margin-top:20px"></div></div>`);
  const rows=[...scr.querySelectorAll('.rule')];
  let i=0;
  const step=()=>{
    if(i>r.hit){
      const f=document.getElementById('fin');
      f.innerHTML=`<div class="card" style="border-color:var(--ink)">
        <div class="eyebrow">MATCHED</div>
        <div style="font-family:var(--mono);font-size:20px;margin:6px 0 4px">${S.rule} → ${r.stage}</div>
        <div style="font-size:12.5px;line-height:1.7;color:var(--ink-2)">${r.why}</div></div>
        <button class="btn" id="go">결과 보기</button>`;
      f.style.opacity=1;
      document.getElementById('go').onclick=()=>{S.view='result';renderResult();};
      updateInsp(); return;
    }
    rows[i].classList.add('shown');
    if(i===r.hit) rows[i].classList.add('hit');
    i++; setTimeout(step, i===r.hit+1?420:190);
  };
  setTimeout(step,240);
}

      ${spermBar(37)}</div>
    <div class="card" style="border-color:var(--ink)">
      <div class="eyebrow">겹쳐 보기</div>
      <div style="font-size:12.5px;line-height:1.8;color:var(--ink-2);margin-top:8px">
        오늘부터 시작한 남편의 금연은 <b>10월 24일 전후</b>의 정자에 반영됩니다.
        그 시점은 아내의 <b>세 번째 다음 주기</b>와 만납니다.</div>
      <div style="margin-top:14px;height:9px;border-radius:5px;background:#E9ECEA;position:relative;overflow:hidden">
        <div style="position:absolute;left:0;width:41%;top:0;bottom:0;background:var(--sperm)"></div>
        <div style="position:absolute;left:33%;width:5%;top:0;bottom:0;background:var(--fertile)"></div>
        <div style="position:absolute;left:66%;width:5%;top:0;bottom:0;background:var(--fertile);opacity:.6"></div>
        <div style="position:absolute;left:99%;width:5%;top:0;bottom:0;background:var(--fertile);opacity:.35"></div></div>
      <div style="font-family:var(--mono);font-size:9px;color:var(--ink-3);margin-top:6px;display:flex;justify-content:space-between">
        <span>오늘</span><span>1주기</span><span>2주기</span><span>3주기 · 반영</span></div></div>
    <div class="slotlbl"><span class="eyebrow">공유 항목</span><hr class="rule"></div>
    <div class="card" style="font-size:12.5px;line-height:2;color:var(--ink-2)">
      <div>주기·가임기 <span class="tag ok" style="float:right">공유 중</span></div>
      <div>체크리스트 <span class="tag ok" style="float:right">공유 중</span></div>
      <div>진단명·유산 이력 <span class="tag" style="float:right">비공개</span></div>
      <div style="font-size:10.5px;color:var(--ink-3);line-height:1.7;margin-top:8px;border-top:1px solid var(--line);padding-top:9px">
        공유는 항목 단위로 켜고 끕니다. 기본값은 비공개이며, 연결을 해제하면 지난 기록도 함께 차단됩니다.</div></div>`
    :`<div class="card" style="text-align:center;padding:32px 20px">
      <div style="font-size:14px;font-weight:600;margin-bottom:7px">아직 연결된 파트너가 없습니다</div>
      <div style="font-size:12.5px;color:var(--ink-2);line-height:1.75;margin-bottom:18px">
        난임 원인의 약 40%는 남성 요인입니다.<br>파트너를 초대하면 서로의 주기가 겹쳐 보이고, 체크리스트를 함께 채웁니다.</div>
      <button class="btn" id="inv">초대 링크 보내기</button></div>
      <div style="font-size:11.5px;color:var(--ink-3);line-height:1.75;margin-top:10px">
        초대해도 진단명·유산 이력은 공유되지 않습니다. 공유 항목은 나중에 직접 고를 수 있어요.</div>`}
  </div>`);
  const inv=document.getElementById('inv');
  if(inv) inv.onclick=()=>{S.a.partner='now';S.layers=layersOf(S.a,S.gender);renderApp();};
}

/* ── 인스펙터 ───────────────────────────── */
function updateInsp(){
  const box=document.getElementById('inspA');
  if(!S.stage){
    const list=S.gender?q():[];
    box.innerHTML=`<div class="kv"><b>단계</b><span>${S.view==='intro'?'온보딩':S.view==='gender'?'성별 선택':'설문 진행'}</span></div>
      ${S.gender?`<div class="kv"><b>트랙</b><span>${S.gender==='F'?'여성 28일':'남성 90일'}</span></div>
      <div class="kv"><b>문항</b><span>${Math.min(S.qi+1,list.length)} / ${list.length}</span></div>`:''}`;
    return;
  }
  const f=S.fri, cm=cycleModel(S.a), fl=redFlags(S.a);
  box.innerHTML=`
    <div class="kv"><b>엔진 A · 분류</b><span>${S.rule} → ${S.gender}-${S.stage}</span></div>
    <div class="kv"><b>위험신호</b><span>${fl.length?fl.length+'개':'없음'}</span></div>
    <div class="kv"><b>엔진 B · 지수</b><span>${f.total} / 100</span></div>
    <div class="kv"><b>최약 도메인</b><span>${f.weak.k} ${f.weak.v}</span></div>
    <div class="kv"><b>BMI</b><span>${f.bmi?f.bmi.toFixed(1):'—'}</span></div>
    <div class="kv"><b>엔진 C · 모드</b><span>${cm.confirmMode?'CONFIRM':'PREDICT ±'+cm.width+'d'}</span></div>
    <div class="kv"><b>레이어</b><span>${S.layers.length?S.layers.map(l=>l.k).join(' '):'—'}</span></div>
    ${fl.length?`<div style="font-size:10.5px;color:var(--amber);line-height:1.6;margin-top:8px">${fl.join(' · ')}</div>`:''}`;
}

/* ── 케이스 스위처 ──────────────────────── */
const ALL=[['F','S1'],['F','S2'],['F','S3'],['F','S4'],['F','S5'],['M','S1'],['M','S2'],['M','S3'],['M','S4'],['M','S5']];
const RATIO={'F-S1':'24.2%','F-S2':'22.6%','F-S3':'7.0%','F-S4':'17.9%','F-S5':'6.3%',
             'M-S1':'4.8%','M-S2':'5.7%','M-S3':'2.2%','M-S4':'6.6%','M-S5':'2.6%'};
function buildSwitcher(){
  const sw=document.getElementById('switcher');
  sw.innerHTML=ALL.map(([g,s])=>{
    const k=g+'-'+s;
    return `<button data-c="${k}" class="${S.gender+'-'+S.stage===k?'on':''}">${k}
      <em>${CASE[k].name.replace(' (남성)','')} · ${RATIO[k]}</em></button>`;
  }).join('');
  sw.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{
    const [g,s]=b.dataset.c.split('-');
    S.gender=g; S.stage=s; S.demo=true;
    if(!S.a.age) S.a={age:g==='F'?32:34,h:g==='F'?163:175,w:g==='F'?72:78,cycle:s==='S1'?'reg':'long',parity:'0',
                      diet:'late',ex:'1',sleep:'6',dx:[],sa:s==='S2'?'never':'normal',habit:[],ttp:'6'};
    if(g==='M'&&s==='S2') S.a.sa='never';
    S.fri=friOf(S.a,g); S.layers=layersOf(S.a,g); S.why='케이스 스위처로 직접 선택한 화면입니다.';
    S.rule={'S1':'R7','S2':'R5','S3':'R2','S4':'R1','S5':'R3'}[s];
    S.view='home'; S.tab='home'; renderApp(); buildSwitcher();
  });
}
document.getElementById('resetBtn').onclick=()=>{
  Object.assign(S,{gender:null,a:{},qi:0,stage:null,rule:null,why:'',fri:null,layers:[],tab:'home',intro:0,view:'intro',done:{},demo:false});
  tabsEl.style.display='none'; document.getElementById('sbRight').textContent='freyaX';
  renderIntro(); buildSwitcher(); updateInsp();
};

/* ── 시작 ───────────────────────────────── */
renderIntro(); buildSwitcher(); updateInsp();
</script>
</body>
</html>
